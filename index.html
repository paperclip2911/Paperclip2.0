<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;
  font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;user-select:none;color:#fff}
canvas{display:block;position:absolute;inset:0}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#ui > *{pointer-events:none}

/* ---------- HUD ---------- */
.hud{position:absolute;background:linear-gradient(180deg,rgba(20,28,45,.94),rgba(12,18,32,.94));
  border:2px solid rgba(120,180,255,.25);border-radius:16px;padding:10px 14px;
  box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px)}
#hudTL{top:12px;left:12px;min-width:210px}
#hudTR{top:12px;right:12px;min-width:190px}
.money{font-size:26px;font-weight:bold;color:#ffd75e;text-shadow:0 2px 0 #8a6a00,0 0 18px rgba(255,200,60,.5);
  letter-spacing:.5px;line-height:1.1}
.income{font-size:13px;color:#7dffb0;font-weight:bold;margin-top:2px}
.income span{color:#c9ffe0}
.lvlrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:bold;color:#9fb6d8}
.xpbar{flex:1;height:9px;background:#0a1220;border-radius:6px;overflow:hidden;border:1px solid rgba(120,180,255,.2)}
.xpfill{height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#a855f7);
  border-radius:6px;transition:width .25s ease}
.trow{display:flex;justify-content:space-between;font-size:12.5px;font-weight:bold;
  color:#cfe0f5;padding:2.5px 0}
.trow b{color:#fff}
#hudTR .trow span:first-child{color:#93a9c9}

/* ---------- Dock ---------- */
#dock{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#dock button{pointer-events:auto;font-family:inherit;font-size:13px;font-weight:bold;color:#eaf2ff;
  background:linear-gradient(180deg,#2b3d5e,#1a2740);border:2px solid rgba(120,180,255,.3);
  border-radius:12px;padding:9px 14px;cursor:pointer;min-width:118px;text-align:left;
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s,filter .12s}
#dock button:hover{filter:brightness(1.22)}
#dock button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
#dock button.hot{border-color:#ffd75e;color:#ffd75e;animation:pulseGold 1.6s infinite}
@keyframes pulseGold{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 0 rgba(255,215,94,0)}
  50%{box-shadow:0 4px 0 rgba(0,0,0,.4),0 0 18px rgba(255,215,94,.65)}}

/* ---------- Prompt / progress ---------- */
#prompt{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
  background:rgba(10,16,28,.92);border:2px solid #ffd75e;border-radius:12px;
  padding:9px 18px;font-size:14px;font-weight:bold;color:#ffd75e;display:none;
  box-shadow:0 0 22px rgba(255,215,94,.35);white-space:nowrap}

/* ---------- Toasts ---------- */
#toasts{position:absolute;top:96px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:7px;align-items:center;width:min(94vw,560px)}
.toast{background:rgba(14,22,38,.95);border-left:4px solid #38bdf8;border-radius:10px;
  padding:9px 16px;font-size:13.5px;font-weight:bold;color:#dbe9ff;
  box-shadow:0 6px 22px rgba(0,0,0,.5);animation:toastIn .28s ease;max-width:100%}
.toast.good{border-left-color:#4ade80;color:#c6ffdd}
.toast.bad{border-left-color:#f43f5e;color:#ffd0d8}
.toast.epic{border-left-color:#a855f7;color:#edd6ff;box-shadow:0 6px 26px rgba(168,85,247,.5)}
.toast.gold{border-left-color:#ffd75e;color:#fff3c4;box-shadow:0 6px 26px rgba(255,215,94,.45)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}

/* ---------- Panel ---------- */
#panel{position:absolute;inset:0;background:rgba(4,8,16,.78);display:none;
  align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px);z-index:20;padding:12px}
#panel.open{display:flex}
.sheet{width:min(96vw,760px);max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#141d30,#0c1422);border:2px solid rgba(120,180,255,.3);
  border-radius:20px;box-shadow:0 22px 70px rgba(0,0,0,.7);overflow:hidden;animation:sheetIn .22s ease}

#panelBody{padding:16px;overflow-y:auto;overscroll-behavior:contain}

.btn.red{background:linear-gradient(180deg,#ff8fa3,#e63757);box-shadow:0 3px 0 #8c1f33;color:#fff}

/* ---------- Pets grid ---------- */
.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.petcell{background:rgba(255,255,255,.045);border:2px solid rgba(120,180,255,.16);

.petcell .pe{font-size:27px;line-height:1.1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.petcell .pn{font-size:10px;font-weight:bold;color:#cfe0f5;margin-top:3px;

/* ---------- Leaderboard ---------- */

/* ---------- Controls ---------- */
#joy{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,180,255,.14),rgba(120,180,255,.05));

#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;

.raceTrack{height:26px;background:#0a1220;border-radius:9px;position:relative;overflow:hidden;

@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shk .35s infinite}
@keyframes shk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.hidden{display:none!important}
.center{text-align:center}
.dim{color:#8ba4c7;font-size:12.5px;line-height:1.55}
h3.sec{font-size:14px;color:#9fb6d8;margin:16px 0 8px;letter-spacing:1px;text-transform:uppercase}
h3.sec:first-child{margin-top:0}
</style>
</head>

const randi=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(a,b)=>{const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;};
const dist=(a,b)=>Math.sqrt(dist2(a,b));

function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<1000) return (n<10? (Math.round(n*10)/10).toString() : Math.floor(n).toString());
  const u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd'];
  let i=0;
  while(n>=1000 && i<u.length-1){n/=1000;i++;}
  return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n).toString())+u[i];
}
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y);

let T=0;            // seconds since start
let NOW=0;          // ms timestamp in seconds

const S={
  money:120, totalEarned:0, xp:0, level:1,
  sp:{speed:1,strength:1,storage:1,shield:1,steal:1,income:1},
  collection:{}, waves:0, rebirths:0,
  stats:{stolen:0,lost:0,eggs:0,waves:0},
};

const bases=[];
const pets=[];       // ALL pets in the world
const bots=[];
const particles=[];
const floaters=[];

const player={
  x:CX, y:CY+RING+300, vx:0, vy:0, baseId:0, carrying:null,
  name:'You', color:'#3b82f6', isPlayer:true, face:'🙂',
  stealProgress:0, stealTarget:null
};

const cam={x:player.x, y:player.y};

/* ------------------------------ base helpers ------------------------------ */
function makeBases(){
  bases.length=0;
  for(let i=0;i<8;i++){
    const ang=Math.PI/2 + i*(Math.PI*2/8);
    const bx=CX+Math.cos(ang)*RING;
    const by=CY+Math.sin(ang)*RING;
    bases.push({
      id:i, x:bx, y:by, hw:BASE_HW, hh:BASE_HH,
      name: i===0?'YOUR BASE':BOT_NAMES[i-1],
      color: i===0?'#3b82f6':BOT_COLORS[i-1],
      isPlayer: i===0, shieldUntil:0, bot:null
    });
  }
}
function baseInner(b){ return {x0:b.x-b.hw+46, x1:b.x+b.hw-46, y0:b.y-b.hh+52, y1:b.y+b.hh-46}; }
function insideBase(b,x,y,pad=0){
  return x>b.x-b.hw-pad && x<b.x+b.hw+pad && y>b.y-b.hh-pad && y<b.y+b.hh+pad;
}

/* ------------------------------ pet helpers ------------------------------ */
function petDef(p){ return PETS[p.sp]; }
function petIncome(p){ return PETS[p.sp].i; }
function petWeight(p){ return RARITY[PETS[p.sp].r].weight; }

function makePet(spId, baseId){
  const b=bases[baseId], inn=baseInner(b);
  const p={
    uid:++uidC, sp:spId, baseId, homeBase:baseId, carrier:null,
    x:rand(inn.x0,inn.x1), y:rand(inn.y0,inn.y1),
    tx:0, ty:0, wt:rand(0.5,2.5), bob:Math.random()*6.28, hop:0
  };
  p.tx=p.x; p.ty=p.y;
  return p;
}
function addPet(spId, baseId){
  const p=makePet(spId,baseId); pets.push(p); return p;
}
function petsOfBase(baseId){
  return pets.filter(p=>p.baseId===baseId && !p.carrier);
}

/* ------------------------------ derived values ------------------------------ */
function incomeMult(){ return (1+(S.sp.income-1)*0.30)*(1+S.rebirths*0.35); }
function income(){
  let sum=0;
  for(const p of pets){ if(p.baseId===0 && !p.carrier) sum+=petIncome(p); }
  return sum*incomeMult();
}
function capacity(){ return 4+S.sp.storage*2; }
function myPets(){ return pets.filter(p=>p.baseId===0).length; }
function power(){
  return S.sp.speed*12 + S.sp.strength*12 + S.sp.storage*4 + S.sp.shield*4
       + S.sp.steal*4 + S.sp.income*4 + income()/8 + S.rebirths*120;
}
function xpNeeded(l){ return Math.floor(80*Math.pow(l,1.6)); }
function addXP(n){
  S.xp+=n;
  let guard=0;
  while(S.xp>=xpNeeded(S.level) && guard++<200){
    S.xp-=xpNeeded(S.level); S.level++;
    toast('🎉 Level up! You reached level '+S.level,'epic');
    burst(player.x,player.y,22,'#a855f7');
  }
}
function upgCost(key){
  const u=UPGRADES[key], lvl=S.sp[key];
  return Math.floor(u.base*Math.pow(u.mult,lvl-1));
}
function carryMult(pet){
  const w=petWeight(pet);
  return clamp(1-w*(0.42-S.sp.strength*0.05),0.28,1);
}
function playerSpeed(){
  let s=SPEEDS[S.sp.speed-1];
  if(player.carrying) s*=carryMult(player.carrying);
  return s;
}
function stealTime(){ return Math.max(0.45, 1.9-S.sp.steal*0.28); }

/* ------------------------------ fx ------------------------------ */
function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, sp=rand(40,260);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:rand(0.35,0.9),max:0.9,color,size:rand(2,5)});
  }
}
function floatText(x,y,text,color,size){
  floaters.push({x,y,text,color:color||'#fff',size:size||15,life:1.1,max:1.1});
}

/* ------------------------------ toasts ------------------------------ */
const toastBox=document.getElementById('toasts');
function toast(msg,type){
  const d=document.createElement('div');
  d.className='toast'+(type?' '+type:'');
  d.textContent=msg;
  toastBox.appendChild(d);
  setTimeout(()=>{
    d.style.transition='opacity .3s,transform .3s';
    d.style.opacity='0'; d.style.transform='translateY(-10px)';
    setTimeout(()=>d.remove(),320);
  },2600);
  while(toastBox.children.length>5) toastBox.removeChild(toastBox.firstChild);
}

/* joystick */
const joy=document.getElementById('joy'), knob=document.getElementById('joyKnob');
let joyActive=false, joyVec={x:0,y:0};
function joyPos(e){
  const r=joy.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  let dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
  const d=Math.hypot(dx,dy), max=r.width/2-14;
  if(d>max){dx=dx/d*max; dy=dy/d*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  joyVec.x=dx/max; joyVec.y=dy/max;
}
joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);joyPos(e);});
joy.addEventListener('pointermove',e=>{if(joyActive)joyPos(e);});
joy.addEventListener('pointerup',e=>{joyActive=false;joyVec.x=0;joyVec.y=0;knob.style.transform='';});
joy.addEventListener('pointercancel',()=>{joyActive=false;joyVec.x=0;joyVec.y=0;knob.style.transform='';});

const stealBtn=document.getElementById('stealBtn');
stealBtn.addEventListener('pointerdown',e=>{e.preventDefault();input.interact=true;});
stealBtn.addEventListener('pointerup',e=>{e.preventDefault();input.interact=false;});
stealBtn.addEventListener('pointercancel',()=>{input.interact=false;});
stealBtn.addEventListener('pointerleave',()=>{input.interact=false;});

/* ==================================================================
   INIT WORLD
   ================================================================== */
function spawnBotPets(){
  for(let i=1;i<8;i++){
    const n=randi(3,5);
    const pool=RAR_ORDER.slice(0,3);
    for(let k=0;k<n;k++){
      const rar=pick(pool);
      const options=PETS.map((p,idx)=>({p,idx})).filter(o=>o.p.r===rar);
      if(options.length) addPet(pick(options).idx,i);
    }
  }
}

function initBots(){
  bots.length=0;
  for(let i=1;i<8;i++){
    bots.push({
      x:bases[i].x, y:bases[i].y, baseId:i, carrying:null,
      name:BOT_NAMES[i-1], color:BOT_COLORS[i-1], isPlayer:false, face:'😈',
      state:'idle', think:rand(3,9), target:null, grabT:0, chaseT:0, stun:0,
      money:rand(400,6000), level:randi(1,6), stolen:0,
      wanderX:bases[i].x, wanderY:bases[i].y, wanderT:0,
      speed:rand(178,228)
    });
    bases[i].bot=bots[bots.length-1];
  }
}

/* ==================================================================
   SAVE / LOAD
   ================================================================== */
function save(){
  try{
    const data={
      money:S.money, totalEarned:S.totalEarned, xp:S.xp, level:S.level,
      sp:{...S.sp}, collection:{...S.collection}, waves:S.waves,
      rebirths:S.rebirths, stats:{...S.stats},
      shieldUntil:bases[0].shieldUntil,
      myPets: pets.filter(p=>p.baseId===0).map(p=>p.sp)
    };
    localStorage.setItem(KEY,JSON.stringify(data));
  }catch(e){}
}
function load(){
  let raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    S.money=d.money||0; S.totalEarned=d.totalEarned||0;
    S.xp=d.xp||0; S.level=d.level||1;
    if(d.sp) for(const k in S.sp) S.sp[k]=d.sp[k]||1;
    S.collection=d.collection||{};
    S.waves=d.waves||0; S.rebirths=d.rebirths||0;
    if(d.stats) Object.assign(S.stats,d.stats);
    bases[0].shieldUntil=d.shieldUntil||0;
    (d.myPets||[]).forEach(sp=>{ if(PETS[sp]) addPet(sp,0); });
    return true;
  }catch(e){ return false; }
}

/* ==================================================================
   PLAYER ACTIONS
   ================================================================== */
function nearestStealable(){
  let best=null,bd=1e18;
  for(const p of pets){
    if(p.carrier) continue;
    if(p.baseId===0) continue;
    if(bases[p.baseId].shieldUntil>NOW) continue;
    const d=dist2(p,player);
    if(d<118*118 && d<bd){ bd=d; best=p; }
  }
  return best;
}

function pickUpPet(pet){
  if(myPets()>=capacity()){
    toast('📦 Your base is full! Upgrade storage.','bad');
    return;
  }
  pet.carrier=player;
  player.carrying=pet;
  const owner=bases[pet.baseId];
  if(owner.bot){
    owner.bot.state='chase'; owner.bot.chaseT=16;
    owner.bot.target=player;
  }
  floatText(player.x,player.y-56,'STEALING!','#ffd75e',16);
  burst(pet.x,pet.y,16,RARITY[petDef(pet).r].color);
  toast('🫳 You grabbed '+petDef(pet).n+'! Get home fast!','gold');
}

function dropCarried(entity,returnHome){
  const pet=entity.carrying;
  if(!pet) return;
  entity.carrying=null;
  pet.carrier=null;
  if(returnHome){
    const hb=bases[pet.homeBase];
    pet.x=hb.x+rand(-120,120); pet.y=hb.y+rand(-90,90);
    pet.baseId=pet.homeBase;
    burst(pet.x,pet.y,18,'#f43f5e');
    floatText(pet.x,pet.y-30,'RETURNED','#ff8fa3',15);
  }
}

function deliverPet(){
  const pet=player.carrying;
  if(!pet) return;
  if(myPets()>=capacity()){
    toast('📦 Base full! Pet dropped outside.','bad');
    dropCarried(player,true);
    return;
  }
  player.carrying=null;
  pet.carrier=null;
  pet.baseId=0;
  pet.homeBase=0;
  const b=bases[0];
  pet.x=b.x+rand(-180,180); pet.y=b.y+rand(-120,120);
  pet.tx=pet.x; pet.ty=pet.y;
  S.stats.stolen++;
  addXP(18+Math.floor(petIncome(pet)*0.25));
  burst(pet.x,pet.y,26,RARITY[petDef(pet).r].color);
  floatText(pet.x,pet.y-40,'+'+petDef(pet).n+'!','#7dffb0',17);
  toast('✅ You stole '+petDef(pet).n+'! +'+fmt(petIncome(pet))+'/s','good');
  const owner=bases[pet.homeBase];
  if(owner.bot){
    owner.bot.state='idle'; owner.bot.think=rand(4,9);
  }
  playSound(660,0.08,'square',0.05);
}

/* simple beeps */
let actx=null;
function playSound(freq,dur,type,vol){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=vol||0.06;
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+(dur||0.1));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+(dur||0.1));
  }catch(e){}
}

/* ==================================================================
   UPDATE
   ================================================================== */
function updatePlayer(dt){
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup']) dy-=1;
  if(keys['s']||keys['arrowdown']) dy+=1;
  if(keys['a']||keys['arrowleft']) dx-=1;
  if(keys['d']||keys['arrowright']) dx+=1;
  if(joyActive){ dx+=joyVec.x; dy+=joyVec.y; }
  const m=Math.hypot(dx,dy);
  if(m>0.01){ dx/=m; dy/=m; }
  else { dx=0; dy=0; }

  const sp=playerSpeed();
  player.x=clamp(player.x+dx*sp*dt,30,WORLD_W-30);
  player.y=clamp(player.y+dy*sp*dt,30,WORLD_H-30);
  player.moving=m>0.01;

  // carrying pet follows
  if(player.carrying){
    const pet=player.carrying;
    pet.x=player.x; pet.y=player.y-44;
  }

  // steal interaction
  const target=nearestStealable();
  const holding=keys['e']||keys[' ']||input.interact;
  if(target){
    player.stealTarget=target;
    if(holding){
      player.stealProgress+=dt/stealTime();
      if(player.stealProgress>=1){
        player.stealProgress=0;
        pickUpPet(target);
      }
    } else {
      player.stealProgress=Math.max(0,player.stealProgress-dt*1.4);
    }
  } else {
    player.stealTarget=null;
    player.stealProgress=0;
  }

  // deliver
  if(player.carrying && insideBase(bases[0],player.x,player.y,-10)){
    deliverPet();
  }

  // prompt
  const pr=document.getElementById('prompt');
  if(player.carrying){
    pr.style.display='block';
    pr.innerHTML='🏠 Carry it home! &nbsp;<span style="color:#7dffb0">Speed '+Math.round(carryMult(player.carrying)*100)+'%</span>';
  } else if(target){
    pr.style.display='block';
    pr.innerHTML='Hold <b>[E]</b> / STEAL to grab <b style="color:'+RARITY[petDef(target).r].color+'">'+petDef(target).n+'</b>';
  } else {
    pr.style.display='none';
  }
}

function updatePets(dt){
  for(const p of pets){
    if(p.carrier) continue;
    p.wt-=dt;
    if(p.wt<=0){
      const b=bases[p.baseId], inn=baseInner(b);
      p.tx=rand(inn.x0,inn.x1); p.ty=rand(inn.y0,inn.y1);
      p.wt=rand(1.2,3.5);
    }
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
    if(d>4){
      const sp=42;
      p.x+=dx/d*sp*dt; p.y+=dy/d*sp*dt;
      p.hop+=dt*10;
    } else { p.hop+=dt*3; }
    p.bob+=dt*2.4;
  }
}

function moveTo(e,tx,ty,speed,dt){
  const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy);
  if(d<3) return true;
  e.x+=dx/d*speed*dt; e.y+=dy/d*speed*dt;
  return false;
}

function updateBot(b,dt){
  if(b.stun>0){ b.stun-=dt; return; }

  if(b.state==='chase'){
    b.chaseT-=dt;
    moveTo(b,player.x,player.y,b.speed*1.12,dt);
    if(dist(b,player)<52 && player.carrying){
      dropCarried(player,true);
      b.state='idle'; b.think=rand(3,6);
      S.stats.lost++;
      toast('💥 '+b.name+' caught you! Pet returned.','bad');
      burst(player.x,player.y,20,'#f43f5e');
      playSound(160,0.18,'sawtooth',0.07);
      return;
    }
    if(b.chaseT<=0 || !player.carrying){ b.state='idle'; b.think=rand(3,7); }
    return;
  }

  if(b.state==='return'){
    const home=bases[b.baseId];
    if(moveTo(b,home.x,home.y,b.speed*0.62,dt) || insideBase(home,b.x,b.y,-20)){
      const pet=b.carrying;
      if(pet){
        pet.carrier=null; pet.baseId=b.baseId; pet.homeBase=b.baseId;
        const inn=baseInner(home);
        pet.x=rand(inn.x0,inn.x1); pet.y=rand(inn.y0,inn.y1);
        if(b.baseId!==0 && pet.baseId===0){}
        burst(pet.x,pet.y,18,'#ffd75e');
        if(pet.homeBase!==b.baseId){}
      }
      b.carrying=null;
      b.state='idle'; b.think=rand(5,11);
      b.money+=rand(50,400);
    }
    if(b.carrying){ b.carrying.x=b.x; b.carrying.y=b.y-40; }
    return;
  }

  if(b.state==='goto'){
    const pet=b.target;
    if(!pet || pet.carrier || pet.baseId===b.baseId || bases[pet.baseId].shieldUntil>NOW){
      b.state='idle'; b.think=rand(2,5); b.target=null; return;
    }
    const d=dist(b,pet);
    if(d>52){ moveTo(b,pet.x,pet.y,b.speed,dt); }
    else {
      b.grabT+=dt;
      if(b.grabT>=1.4){
        pet.carrier=b; b.carrying=pet; b.grabT=0;
        b.state='return';
        if(pet.baseId===0){
          toast('🚨 '+b.name+' is stealing your '+petDef(pet).n+'!','bad');
          playSound(300,0.15,'square',0.06);
        }
      }
    }
    return;
  }

  // idle wander
  b.think-=dt;
  b.wanderT-=dt;
  if(b.wanderT<=0){
    const inn=baseInner(bases[b.baseId]);
    b.wanderX=rand(inn.x0,inn.x1); b.wanderY=rand(inn.y0,inn.y1);
    b.wanderT=rand(2,5);
  }
  moveTo(b,b.wanderX,b.wanderY,b.speed*0.42,dt);

  if(b.think<=0){
    b.think=rand(5,12);
    trySteal(b);
  }
}

function trySteal(b){
  if(b.carrying) return;
  // gather candidate pets in other bases
  const cands=pets.filter(p=>!p.carrier && p.baseId!==b.baseId && bases[p.baseId].shieldUntil<=NOW);
  if(!cands.length) return;
  // weight toward the player's base for drama
  let target=null;
  const playerPets=cands.filter(p=>p.baseId===0);
  if(playerPets.length && Math.random()<0.45) target=pick(playerPets);
  else target=pick(cands);

  const owner=bases[target.baseId];
  if(owner.bot && owner.bot===b) return;

  b.target=target; b.state='goto'; b.grabT=0;
  if(target.baseId===0){
    toast('⚠️ '+b.name+' is heading toward your base!','bad');
  }
}

/* ------------------------------ leaderboard ------------------------------ */
function leaderboardData(){
  const rows=[];
  rows.push({name:'You', money:S.money, stolen:S.stats.stolen, level:S.level,
             waves:S.waves, me:true, color:'#3b82f6'});
  for(const b of bots){
    rows.push({name:b.name, money:b.money, stolen:b.stolen, level:b.level,
               waves:Math.min(49,Math.floor(b.level*3.1)), me:false, color:b.color});
  }
  return rows;
}

/* ------------------------------ particles ------------------------------ */
function updateFX(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.94; p.vy*=0.94;
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];
    f.life-=dt; f.y-=42*dt;
    if(f.life<=0) floaters.splice(i,1);
  }
}

/* ------------------------------ main update ------------------------------ */
let moneyAcc=0;
function update(dt){
  T+=dt; NOW=performance.now()/1000;

  // income
  const inc=income();
  if(inc>0){
    S.money+=inc*dt;
    S.totalEarned+=inc*dt;
  }

  updatePlayer(dt);
  for(const b of bots) updateBot(b,dt);
  updatePets(dt);
  updateFX(dt);

  // bot money growth
  for(const b of bots){
    let bi=0;
    for(const p of pets){ if(p.baseId===b.baseId && !p.carrier) bi+=petIncome(p); }
    b.money+=bi*dt*(0.8+Math.random()*0.05);
    b.level=Math.max(b.level,Math.min(60,Math.floor(Math.sqrt(b.money)/40)+1));
  }

  // camera
  cam.x=lerp(cam.x,player.x,Math.min(1,dt*7));
  cam.y=lerp(cam.y,player.y,Math.min(1,dt*7));
  const halfW=Math.min(VW/2,WORLD_W/2), halfH=Math.min(VH/2,WORLD_H/2);
  cam.x=clamp(cam.x,halfW,WORLD_W-halfW);
  cam.y=clamp(cam.y,halfH,WORLD_H-halfH);
}

/* ==================================================================
   RENDER
   ================================================================== */
function drawGround(){
  const TS=210;
  const x0=Math.floor((cam.x-VW/2-TS)/TS)*TS, x1=cam.x+VW/2+TS;
  const y0=Math.floor((cam.y-VH/2-TS)/TS)*TS, y1=cam.y+VH/2+TS;
  for(let x=x0;x<x1;x+=TS){
    for(let y=y0;y<y1;y+=TS){
      const even=((x/TS)+(y/TS))%2===0;
      ctx.fillStyle=even?'#2e5137':'#294a32';
      ctx.fillRect(x,y,TS+1,TS+1);
    }
  }
  // grid lines
  ctx.strokeStyle='rgba(0,0,0,.07)'; ctx.lineWidth=2;
  ctx.beginPath();
  for(let x=x0;x<x1;x+=TS){ ctx.moveTo(x,y0); ctx.lineTo(x,y1); }
  for(let y=y0;y<y1;y+=TS){ ctx.moveTo(x0,y); ctx.lineTo(x1,y); }
  ctx.stroke();

  // center plaza
  const px=CX, py=CY;
  if(Math.abs(cam.x-px)<VW/2+700 && Math.abs(cam.y-py)<VH/2+700){
    ctx.beginPath(); ctx.arc(px,py,360,0,6.283);
    ctx.fillStyle='#3b4a5e'; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,360,0,6.283);
    ctx.strokeStyle='#5a7291'; ctx.lineWidth=10; ctx.stroke();
    ctx.beginPath(); ctx.arc(px,py,200,0,6.283);
    ctx.fillStyle='#2b3a4d'; ctx.fill();
    // fountain
    ctx.beginPath(); ctx.arc(px,py,90,0,6.283);
    ctx.fillStyle='#1b2a3d'; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,74,0,6.283);
    ctx.fillStyle='#2f6f9e'; ctx.fill();
    ctx.font='70px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⛲',px,py-4);
  }
}

function drawBase(b){
  const x=b.x-b.hw, y=b.y-b.hh, w=b.hw*2, h=b.hh*2;
  if(x>cam.x+VW/2+80 || x+w<cam.x-VW/2-80 || y>cam.y+VH/2+80 || y+h<cam.y-VH/2-80) return;

  // floor
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=26; ctx.shadowOffsetY=10;
  rr(ctx,x,y,w,h,26);
  ctx.fillStyle=b.isPlayer?'#1d2c46':'#251f2e';
  ctx.fill();
  ctx.restore();

  // inner pattern
  rr(ctx,x+12,y+12,w-24,h-24,20);
  ctx.fillStyle=b.isPlayer?'rgba(59,130,246,.10)':'rgba(255,255,255,.035)';
  ctx.fill();

  // border
  rr(ctx,x,y,w,h,26);
  ctx.strokeStyle=b.color; ctx.lineWidth=6; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=2; ctx.stroke();

  // door gap (bottom)
  ctx.save();
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='#000';
  ctx.fillRect(b.x-62,y+h-14,124,20);
  ctx.restore();

  // shield
  if(b.shieldUntil>NOW){
    const a=0.25+0.15*Math.sin(T*5);
    rr(ctx,x-8,y-8,w+16,h+16,30);
    ctx.strokeStyle='rgba(56,189,248,'+a+')'; ctx.lineWidth=6; ctx.stroke();
    ctx.fillStyle='rgba(56,189,248,.07)'; ctx.fill();
    ctx.font='30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🛡️',b.x,y-14);
  }

  // sign
  const label=b.isPlayer?'YOUR BASE':b.name;
  ctx.font='bold 17px Trebuchet MS';
  const tw=ctx.measureText(label).width;
  rr(ctx,b.x-tw/2-14,y-24,tw+28,32,10);
  ctx.fillStyle='rgba(6,12,22,.9)'; ctx.fill();
  ctx.strokeStyle=b.color; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle=b.color;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,b.x,y-7);

  // capacity hint for player
  if(b.isPlayer){
    const c=myPets(), cap=capacity();
    ctx.font='bold 13px Trebuchet MS';
    ctx.fillStyle=c>=cap?'#ff8fa3':'#9fb6d8';
    ctx.fillText(c+' / '+cap+' pets',b.x,y+h-26);
  }
}

function drawPet(p){
  const def=petDef(p), rar=RARITY[def.r];
  const bob=Math.sin(p.bob)*3 + (p.hop>0?Math.abs(Math.sin(p.hop))*5:0);
  const y=p.y+bob;

  // shadow
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(p.x,p.y+16,15,6,0,0,6.283); ctx.fill();

  // glow for high rarity
  if(RAR_ORDER.indexOf(def.r)>=3){
    ctx.save();
    ctx.globalAlpha=0.35+0.18*Math.sin(T*3+p.uid);
    ctx.beginPath(); ctx.arc(p.x,y,26,0,6.283);
    ctx.fillStyle=rar.color; ctx.filter='blur(0px)';
    ctx.globalAlpha=0.18;
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.shadowColor=rar.color;
  ctx.shadowBlur=RAR_ORDER.indexOf(def.r)>=4?18:0;
  ctx.font='30px serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(def.e,p.x,y);
  ctx.restore();
}

function drawEntity(e){
  const isP=e.isPlayer;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(e.x,e.y+20,17,7,0,0,6.283); ctx.fill();

  // body
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=12; ctx.shadowOffsetY=5;
  rr(ctx,e.x-17,e.y-18,34,38,12);
  ctx.fillStyle=e.color; ctx.fill();
  ctx.restore();
  rr(ctx,e.x-17,e.y-18,34,38,12);
  ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2.5; ctx.stroke();
  rr(ctx,e.x-13,e.y-14,26,12,6);
  ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fill();

  // face
  ctx.font='21px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(isP?'🙂':'😈',e.x,e.y+2);

  // name tag
  ctx.font='bold 12px Trebuchet MS';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const nm=e.name;
  const tw=ctx.measureText(nm).width;
  rr(ctx,e.x-tw/2-7,e.y-42,tw+14,19,8);
  ctx.fillStyle='rgba(6,12,22,.82)'; ctx.fill();
  ctx.fillStyle=isP?'#9fd0ff':'#ffb3b3';
  ctx.fillText(nm,e.x,e.y-32);

  // carried pet
  if(e.carrying){
    const def=petDef(e.carrying);
    ctx.save();
    ctx.shadowColor=RARITY[def.r].color; ctx.shadowBlur=16;
    ctx.font='30px serif';
    ctx.fillText(def.e,e.x,e.y-56+Math.sin(T*8)*3);
    ctx.restore();
  }
}

function drawStealProgress(){
  if(!player.stealTarget || player.stealProgress<=0) return;
  const p=player.stealTarget;
  const w=70,h=11;
  const x=p.x-w/2, y=p.y-48;
  rr(ctx,x,y,w,h,6);
  ctx.fillStyle='rgba(0,0,0,.72)'; ctx.fill();
  rr(ctx,x+1.5,y+1.5,(w-3)*clamp(player.stealProgress,0,1),h-3,5);
  ctx.fillStyle='#ffd75e'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5;
  rr(ctx,x,y,w,h,6); ctx.stroke();
}

function drawFX(){
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*a,0,6.283); ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const f of floaters){
    const a=clamp(f.life/f.max,0,1);
    ctx.globalAlpha=a;
    ctx.font='bold '+f.size+'px Trebuchet MS';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.75)';
    ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.color;
    ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#1a2b1f';
  ctx.fillRect(0,0,VW,VH);

  ctx.save();
  ctx.translate(Math.round(VW/2-cam.x),Math.round(VH/2-cam.y));

  drawGround();
  for(const b of bases) drawBase(b);

  // pets
  for(const p of pets){
    if(p.carrier) continue;
    if(Math.abs(p.x-cam.x)>VW/2+80 || Math.abs(p.y-cam.y)>VH/2+80) continue;
    drawPet(p);
  }

  drawStealProgress();

  // entities sorted by y
  const ents=[player,...bots].sort((a,b)=>a.y-b.y);
  for(const e of ents){
    if(Math.abs(e.x-cam.x)>VW/2+120 || Math.abs(e.y-cam.y)>VH/2+120) continue;
    drawEntity(e);
  }

  drawFX();
  ctx.restore();

  // vignette
  const g=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*0.35,VW/2,VH/2,Math.max(VW,VH)*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
}

  });

function rollEgg(egg){
  const total=Object.values(egg.w).reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  let chosen=null;
  for(const k in egg.w){
    r-=egg.w[k];
    if(r<=0){ chosen=k; break; }
  }
  if(!chosen) chosen=Object.keys(egg.w)[0];
  const pool=PETS.map((p,i)=>({p,i})).filter(o=>o.p.r===chosen);
  return pick(pool).i;
}

function openEgg(eggId){
  const egg=EGGS.find(e=>e.id===eggId);
  if(!egg || S.money<egg.cost) return;
  S.money-=egg.cost;
  S.stats.eggs++;

  panelTitle.textContent='🥚 Hatching...';
  panelBody.innerHTML=`<div class="center" style="padding:26px 0">
    <div class="bigpet shake" style="font-size:96px">🥚</div>
    <div class="dim" style="margin-top:16px">Cracking open your ${egg.name}...</div>
  </div>`;

  setTimeout(()=>{
    const sp=rollEgg(egg);
    const def=PETS[sp], rar=RARITY[def.r];
    addPet(sp,0);
    S.collection[sp]=(S.collection[sp]||0)+1;
    addXP(10+RAR_ORDER.indexOf(def.r)*22);

    panelBody.innerHTML=`<div class="center" style="padding:18px 0">
      <div class="bigpet">${def.e}</div>
      <div style="font-size:22px;font-weight:bold;margin-top:12px;color:${rar.color};
        text-shadow:0 0 22px ${rar.color}">${def.n}</div>
      <div style="font-size:13px;font-weight:bold;letter-spacing:2px;color:${rar.color};margin-top:4px">
        ${rar.name.toUpperCase()}</div>
      <div style="font-size:16px;font-weight:bold;color:#7dffb0;margin-top:10px">
        💵 +${fmt(def.i)}/sec</div>
      <div class="btnrow" style="max-width:260px;margin:22px auto 0">
        <button class="btn gold" id="hatchAgain">Hatch Another — 💰 ${fmt(egg.cost)}</button>
      </div>
      <div class="btnrow" style="max-width:260px;margin:10px auto 0">
        <button class="btn blue" id="backToEggs">Back to Eggs</button>
      </div>
    </div>`;

    const t=document.getElementById('hatchAgain');
    if(t) t.disabled=S.money<egg.cost;
    if(t) t.onclick=()=>openEgg(eggId);
    document.getElementById('backToEggs').onclick=()=>renderEggs();

    burst(player.x,player.y,30,rar.color);
    if(RAR_ORDER.indexOf(def.r)>=4){
      toast('✨ WOW! You hatched a '+rar.name+' '+def.n+'!','epic');
      playSound(1046,0.2,'sine',0.07);
      setTimeout(()=>playSound(1318,0.25,'sine',0.07),140);
    } else {
      toast('🥚 Hatched '+def.n+' ('+rar.name+')','good');
      playSound(660,0.1,'sine',0.05);
    }
    save();
  },950);
}

/* ---------- WAVES ---------- */
function waveRequirement(g){ return 12+g*20; }

function renderWaves(){
  panelTitle.textContent='🌍 Challenge Worlds';
  const g=S.waves;
  const wi=Math.min(WORLDS.length-1,Math.floor(g/WAVES_PER_WORLD));
  const wIn=g%WAVES_PER_WORLD;
  const req=waveRequirement(g);
  const p=power();
  const can=p>=req;
  const allDone=g>=WORLDS.length*WAVES_PER_WORLD;

  let html=`<div class="card" style="margin-bottom:14px">
    <div class="ct">${WORLDS[wi].emoji} ${WORLDS[wi].name}
      <span style="margin-left:auto;font-size:12px;color:#7dffb0">Wave ${wIn+1}/${WAVES_PER_WORLD}</span></div>
    <div class="cd" style="min-height:0">
      Required Power: <b style="color:#ffd75e">${req}</b> &nbsp;·&nbsp;
      Your Power: <b style="color:${can?'#7dffb0':'#ff8fa3'}">${Math.floor(p)}</b><br>
      ${allDone?'👑 All 50 waves cleared! Endless mode active.':'Reward: 💰 '+fmt(Math.floor(180*Math.pow(1.32,g)))+' + XP'}
    </div>
    <div class="btnrow">
      <button class="btn gold" id="attemptWave" ${can?'':'disabled'}>
        ${can?'▶ ATTEMPT WAVE':'🔒 Need '+Math.ceil(req)+' Power'}
      </button>
    </div>
  </div>`;

  html+='<h3 class="sec">Worlds</h3>';
  html+='<div class="grid g2">';
  for(let i=0;i<WORLDS.length;i++){
    const w=WORLDS[i];
    const cleared=clamp(g-i*WAVES_PER_WORLD,0,WAVES_PER_WORLD);
    const locked=(i*WAVES_PER_WORLD)>g;
    html+=`<div class="card" style="${locked?'opacity:.45':''}">
      <div class="ct">${w.emoji} ${w.name}</div>
      <div class="cd" style="min-height:0">${
        locked?'🔒 Locked — clear previous world':'Progress: '+cleared+' / '+WAVES_PER_WORLD+' waves'
      }</div>
      <div style="height:9px;background:#0a1220;border-radius:6px;margin-top:8px;overflow:hidden">
        <div style="height:100%;width:${cleared/WAVES_PER_WORLD*100}%;
          background:linear-gradient(90deg,#38bdf8,#a855f7)"></div></div>
    </div>`;
  }
  html+='</div>';
  panelBody.innerHTML=html;

  const btn=document.getElementById('attemptWave');
  if(btn && can) btn.onclick=()=>runWave();
}

function runWave(){
  const g=S.waves;
  const req=waveRequirement(g);
  if(power()<req) return;

  const isBoss=(g%WAVES_PER_WORLD)===WAVES_PER_WORLD-1;
  panelTitle.textContent=isBoss?'⚔️ BOSS WAVE':'🏁 Wave Race';
  panelBody.innerHTML=`<div class="center" style="padding:6px 0 0">
    <div class="dim" style="margin-bottom:10px">${WORLDS[Math.min(9,Math.floor(g/5))].emoji} ${WORLDS[Math.min(9,Math.floor(g/5))].name} — Wave ${(g%5)+1}</div>
    <div class="race">
      <div class="raceTrack"><div class="raceFill" id="rMe"></div><span class="raceLabel">YOU</span></div>
      <div class="raceTrack"><div class="raceFill rival" id="rBot"></div><span class="raceLabel">RIVAL</span></div>
    </div>
    <div class="dim" id="raceMsg">Racing...</div>
  </div>`;

  const meEl=document.getElementById('rMe'), botEl=document.getElementById('rBot');
  const myDur=1400 - S.sp.speed*140 - S.sp.strength*40;
  const botDur=myDur + rand(-140,320);
  const t0=performance.now();

  function step(){
    const el=performance.now()-t0;
    const a=clamp(el/myDur,0,1), b=clamp(el/botDur,0,1);
    if(meEl) meEl.style.width=(a*100)+'%';
    if(botEl) botEl.style.width=(b*100)+'%';
    if(a>=1 || b>=1){
      finishWave(g,isBoss,a>=b);
      return;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function finishWave(g,isBoss,won){
  const reward=Math.floor(180*Math.pow(1.32,g));
  const xp=30+g*12;
  S.waves++;
  S.stats.waves++;
  S.money+=reward;
  S.totalEarned+=reward;
  addXP(xp);

  let extraHtml='';
  if(isBoss){
    // bonus egg or pet
    const tier=clamp(Math.floor(g/5),0,EGGS.length-1);
    const egg=EGGS[tier];
    const sp=rollEgg(egg);
    addPet(sp,0);
    S.collection[sp]=(S.collection[sp]||0)+1;
    const d=PETS[sp], r=RARITY[d.r];
    extraHtml=`<div class="bigpet" style="margin-top:16px">${d.e}</div>
      <div style="font-weight:bold;font-size:17px;color:${r.color};margin-top:6px">${d.n}</div>
      <div style="font-size:11px;letter-spacing:2px;color:${r.color}">${r.name.toUpperCase()} — BOSS REWARD</div>`;
    toast('👑 Boss defeated! You earned a '+r.name+' '+d.n+'!','epic');
    playSound(1046,0.22,'sine',0.07);
  } else {
    toast('🏁 Wave cleared! +💰'+fmt(reward)+' +'+xp+' XP','good');
    playSound(784,0.12,'square',0.05);
  }
  burst(player.x,player.y,26,'#ffd75e');

  panelBody.innerHTML=`<div class="center" style="padding:14px 0">
    <div style="font-size:46px">🏆</div>
    <div style="font-size:20px;font-weight:bold;color:#ffd75e;margin-top:8px">WAVE CLEARED!</div>
    <div style="font-size:14px;color:#7dffb0;margin-top:8px">+💰 ${fmt(reward)} &nbsp; +${xp} XP</div>
    ${extraHtml}
    <div class="btnrow" style="max-width:280px;margin:22px auto 0">
      <button class="btn gold" id="nextWave">Continue</button>
    </div>
  </div>`;
  const nb=document.getElementById('nextWave');
  if(nb) nb.onclick=()=>renderWaves();
  save();
}

/* ---------- LEADERBOARD ---------- */
function renderBoard(){
  panelTitle.textContent='🏆 Leaderboard';
  const rows=leaderboardData();
  const cats=[
    {key:'money', label:'💰 Richest Players', fmtv:v=>'💰 '+fmt(v)},
    {key:'stolen',label:'🫳 Most Pets Stolen', fmtv:v=>v+' pets'},
    {key:'level', label:'⭐ Highest Level',    fmtv:v=>'Lv '+v},
    {key:'waves', label:'🌍 Most Waves',       fmtv:v=>v+' waves'},
  ];
  let html='';
  for(const c of cats){
    const sorted=rows.slice().sort((a,b)=>b[c.key]-a[c.key]).slice(0,8);
    html+=`<h3 class="sec">${c.label}</h3>`;
    sorted.forEach((r,i)=>{
      html+=`<div class="lbrow ${r.me?'me':''}">
        <span class="lbrank">#${i+1}</span>
        <span style="width:9px;height:9px;border-radius:50%;background:${r.color};flex:none"></span>
        <span class="lbname">${r.name}</span>
        <span class="lbval">${c.fmtv(r[c.key])}</span>
      </div>`;
    });
  }
  html+=`<h3 class="sec">Your Career</h3>
  <div class="card"><div class="cd" style="min-height:0;line-height:1.9;font-size:13px">
    🫳 Pets stolen: <b>${S.stats.stolen}</b><br>
    💔 Pets lost: <b>${S.stats.lost}</b><br>
    🥚 Eggs hatched: <b>${S.stats.eggs}</b><br>
    🌍 Waves cleared: <b>${S.stats.waves}</b><br>
    ♻️ Rebirths: <b>${S.rebirths}</b><br>
    💰 Lifetime earnings: <b>${fmt(S.totalEarned)}</b>
  </div></div>`;
  panelBody.innerHTML=html;
}

/* ---------- REBIRTH ---------- */
function renderRebirth(){
  panelTitle.textContent='♻️ Rebirth';
  const reqLevel=20, reqMoney=500000;
  const can=S.level>=reqLevel && S.money>=reqMoney;
  panelBody.innerHTML=`<div class="center" style="padding:10px 0">
    <div style="font-size:54px">♻️</div>
    <div style="font-size:18px;font-weight:bold;color:#c78bff;margin-top:8px">Rebirth ${S.rebirths+1}</div>
    <div class="dim" style="margin-top:12px;max-width:420px;margin-left:auto;margin-right:auto;text-align:left">
      <b style="color:#fff">Requirements:</b><br>
      ⭐ Level ${reqLevel} — <span style="color:${S.level>=reqLevel?'#7dffb0':'#ff8fa3'}">you are Lv ${S.level}</span><br>
      💰 ${fmt(reqMoney)} — <span style="color:${S.money>=reqMoney?'#7dffb0':'#ff8fa3'}">you have ${fmt(S.money)}</span>
      <br><br>
      <b style="color:#fff">Rewards:</b><br>
      ✅ Permanent <b style="color:#ffd75e">+35% income</b> per rebirth<br>
      ✅ <b style="color:#ffd75e">+120 Power</b> for challenges<br>
      ✅ One free <b style="color:#f43f5e">Mythic-or-better</b> pet<br>
      ✅ Keeps all your pets!<br><br>
      <b style="color:#fff">Resets:</b><br>
      ❌ Money goes back to ${fmt(200)}<br>
      ❌ All upgrades reset to Level 1
    </div>
    <div class="btnrow" style="max-width:300px;margin:22px auto 0">
      <button class="btn purple" id="doRebirth" ${can?'':'disabled'}>
        ${can?'♻️ REBIRTH NOW':'🔒 Requirements not met'}
      </button>
    </div>
    <div class="dim" style="margin-top:14px">Current income multiplier: <b style="color:#7dffb0">×${incomeMult().toFixed(2)}</b></div>
  </div>`;

  const b=document.getElementById('doRebirth');
  if(b&&can) b.onclick=()=>{
    S.rebirths++;
    S.money=200;
    S.level=1; S.xp=0;
    for(const k in S.sp) S.sp[k]=1;
    // free mythic+ pet
    const pool=PETS.map((p,i)=>({p,i})).filter(o=>RAR_ORDER.indexOf(o.p.r)>=5);
    const sp=pick(pool).i;
    addPet(sp,0);
    S.collection[sp]=(S.collection[sp]||0)+1;
    const d=PETS[sp], r=RARITY[d.r];
    burst(player.x,player.y,50,'#c78bff');
    toast('♻️ REBIRTH '+S.rebirths+'! You got a '+r.name+' '+d.n+'!','epic');
    playSound(523,0.15,'sine',0.07);
    setTimeout(()=>playSound(784,0.2,'sine',0.07),150);
    setTimeout(()=>playSound(1046,0.3,'sine',0.07),300);
    renderRebirth(); save();
  };
}

/* ==================================================================
   BOOT
   ================================================================== */
function newGame(){
  S.money=120; S.totalEarned=0; S.xp=0; S.level=1;
  for(const k in S.sp) S.sp[k]=1;
  S.collection={}; S.waves=0; S.rebirths=0;
  S.stats={stolen:0,lost:0,eggs:0,waves:0};
  bases[0].shieldUntil=0;
  // starter pet
  addPet(0,0); // Puppy
  S.collection[0]=1;
  setTimeout(()=>{
    toast('🐾 Welcome to STEAL THE PETS!','gold');
    setTimeout(()=>toast('Steal pets from other bases and bring them home!',''),2200);
    setTimeout(()=>toast('Hold [E] near a pet to steal it. Good luck!','good'),4600);
  },400);
}

function boot(){
  makeBases();
  initBots();
  const loaded=load();
  spawnBotPets();
  if(!loaded) newGame();
  player.x=bases[0].x;
  player.y=bases[0].y+260;
  cam.x=player.x; cam.y=player.y;

  // auto-save
  setInterval(save,8000);
  window.addEventListener('beforeunload',save);

  let last=performance.now();
  function loop(now){
    const dt=Math.min(0.05,(now-last)/1000);
    last=now;
    update(dt);
    render();
    updateHUD(dt);
    if(currentPanel==='shop'||currentPanel==='waves'){ /* live refresh off */ }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
boot();
</script>
