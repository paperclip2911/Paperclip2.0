<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drop &amp; HODL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f3; --panel:#ffffff; --panel2:#f6f7f9; --ink:#161a20; --mute:#6b7480; --line:#e1e4e9;
  --acc:#2a5adf; --onacc:#ffffff; --info:#2a5adf; --good:#127a4d; --bad:#c02f2f; --warn:#9a6b0c;
  --disp:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --text:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:8px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --ink:#e6e9ee; --mute:#8b96a5; --line:#2a323d;
    --acc:#5b8cff; --onacc:#0b1220; --info:#5b8cff; --good:#3ecf8e; --bad:#ff6b6b; --warn:#e8b74f;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel2:#1b232d; --ink:#e6e9ee; --mute:#8b96a5; --line:#2a323d;
  --acc:#5b8cff; --onacc:#0b1220; --info:#5b8cff; --good:#3ecf8e; --bad:#ff6b6b; --warn:#e8b74f;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 90px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}

/* ===== HUD ===== */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);margin:0 -12px;padding:10px 12px 8px}
.hud-top{display:flex;align-items:baseline;gap:10px}
.brand{font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.dayn{font:700 18px/1 var(--disp);font-family:var(--mono)}
.actn{font-size:12.5px;color:var(--mute);flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;gap:2px 14px}
.st{border-left:2px solid var(--line);padding-left:9px}
.st:first-child{border-left:0;padding-left:0}
.st small{display:block;font-size:11px;color:var(--mute);letter-spacing:.03em;text-transform:uppercase;line-height:1.2}
.st b{font:600 16px/1.3 var(--mono);letter-spacing:-.01em}
.pips{display:flex;gap:2px;flex-wrap:wrap;margin-top:3px}
.pip{width:9px;height:9px;border:1px solid var(--line);border-radius:2px;background:var(--panel2);transition:background .2s}
.pip.on{background:var(--acc);border-color:var(--acc)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.mini small{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);line-height:1.2}
.bar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--info);transition:width .3s}
.bar.g i{background:var(--good)}.bar.r i{background:var(--bad)}.bar.y i{background:var(--warn)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.st:nth-child(3){border-left:0;padding-left:0}}

/* ===== ticker ===== */
.ticker{display:flex;gap:0;overflow-x:auto;background:var(--ink);margin:0 -12px;padding:0;scrollbar-width:none;border-bottom:1px solid var(--line)}
.ticker::-webkit-scrollbar{display:none}
.tk{flex:none;display:flex;align-items:center;gap:7px;padding:6px 14px;border-right:1px solid rgba(255,255,255,.08);white-space:nowrap}
.tk b{color:#fff;font:600 12.5px var(--mono)}
.tk .p{color:#fff;font:600 12.5px var(--mono)}
.tk .c{font:600 11px var(--mono)}
.tk .c.up{color:#4ade80}.tk .c.dn{color:#f87171}
.tk canvas{display:block;width:46px;height:18px}

/* ===== auto-day bar ===== */
.autobar{display:flex;align-items:center;gap:8px;margin:0 -12px;padding:6px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.autobar .prog{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.autobar .prog i{display:block;height:100%;background:var(--acc);width:0%}
.autobtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:26px;height:26px;display:grid;place-items:center;cursor:pointer;flex:none;font-size:12px;color:var(--ink)}
.autobtn.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.spdsel{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.spdsel button{border:0;background:var(--panel);padding:4px 8px;font-size:11px;cursor:pointer;color:var(--mute)}
.spdsel button.on{background:var(--acc);color:var(--onacc)}
.spdsel button+button{border-left:1px solid var(--line)}

/* ===== tabs ===== */
.tabs{display:flex;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);margin:0 -12px 14px;padding:0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 12px;border:0;background:none;font:500 13px var(--disp);color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;min-height:40px;display:flex;align-items:center;gap:5px}
.tab.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:var(--acc);color:var(--onacc);font:600 10.5px var(--mono);text-align:center;line-height:16px}

/* ===== cards ===== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px}
.card>h3,.h{font:600 14px/1.3 var(--disp);margin:0 0 8px;letter-spacing:-.005em;color:var(--ink)}
.card p{margin:.35em 0}
.g2{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
@media(min-width:860px){.g2{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.mute{color:var(--mute)}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--info)}
.num{font-family:var(--mono);font-weight:600}
.small{font-size:12.5px;line-height:1.45}
.rt{text-align:right}
.tag{display:inline-block;font:500 10.5px var(--disp);padding:1px 6px;background:var(--panel2);color:var(--mute);border-radius:4px;margin:0 4px 2px 0;white-space:nowrap;border:1px solid var(--line)}
.tag.good{color:var(--good);border-color:currentColor;background:none}
.tag.bad{color:var(--bad);border-color:currentColor;background:none}
.tag.warn{color:var(--warn);border-color:currentColor;background:none}
.li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li:first-of-type{border-top:0}
.li>div:first-child{min-width:0}
.hint{font-style:normal;color:var(--mute);font-size:13px}

/* ===== buttons ===== */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:6px;font:500 13px var(--disp);cursor:pointer;min-height:38px;text-align:center;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:var(--panel2);border-color:var(--mute)}
.btn.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08)}
.btn.dark{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.act{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;min-height:76px}
.act b{font:600 13.5px var(--disp)}
.act span{font:400 11.5px var(--text);color:var(--mute)}
.act .cost{font:600 11px var(--mono);color:var(--info)}
.btn.pri.act span{color:rgba(255,255,255,.8)}
.btn.pri.act .cost{color:rgba(255,255,255,.95)}
.btn.dark.act span{color:rgba(255,255,255,.65)}
.btn.dark.act .cost{color:rgba(255,255,255,.85)}
.endday{position:relative;display:block;width:100%;margin-top:14px;padding:14px 16px;font:600 14px var(--disp);background:var(--ink);color:var(--panel);border:1px solid var(--ink);border-radius:var(--r);cursor:pointer}
.endday small{display:block;font:400 11.5px var(--text);margin-top:2px;opacity:.65}
input[type=text],textarea{width:100%;padding:9px 11px;font:500 14px var(--disp);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px}
textarea{font:12px/1.4 var(--mono);min-height:110px}

/* ===== overlay + scenes ===== */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:12px 12px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .16s ease-out;border:1px solid var(--line);border-bottom:0}
@media(min-width:740px){.ov{align-items:center}.sheet{border-radius:12px;max-height:88%;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.story h2{font:700 22px/1.25 var(--disp);margin:0 0 12px;letter-spacing:-.01em}
.story p{font-size:14.5px;line-height:1.6;margin:0 0 14px;max-width:62ch;color:var(--ink)}
.ch{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;cursor:pointer;font:600 13.5px var(--disp);color:var(--ink)}
.ch small{display:block;font:400 12px/1.4 var(--text);color:var(--mute);margin-top:3px}
.ch:hover:not(:disabled){background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.ch:hover:not(:disabled) small{color:inherit;opacity:.85}
.ch:disabled{opacity:.42;cursor:not-allowed}

/* ===== chat ===== */
.buyer{display:flex;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.avatar{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:19px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.msg{max-width:85%;padding:7px 11px;border-radius:10px;margin:7px 0;font-size:13.5px;line-height:1.4;width:fit-content}
.msg.b{background:var(--panel2);border:1px solid var(--line);border-top-left-radius:2px}
.msg.y{background:var(--acc);color:var(--onacc);margin-left:auto;border-top-right-radius:2px}
.msg.n{background:none;color:var(--mute);font-style:italic;padding:2px 0;max-width:100%;font-size:12.5px}

/* ===== market ===== */
.coin{padding:12px 0;border-top:1px solid var(--line)}
.coin:first-of-type{border-top:0}
.coin canvas{width:100%;height:52px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-weight:600;font-family:var(--mono)}

/* ===== toasts ===== */
#toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:70;pointer-events:none;padding:0 12px}
.toast{background:var(--ink);color:var(--panel);padding:7px 14px;border-radius:7px;font:500 13px var(--disp);max-width:520px;text-align:center;animation:up .15s ease-out;box-shadow:0 4px 16px rgba(0,0,0,.18)}

/* ===== splash ===== */
.splash{max-width:480px;margin:9vh auto 0}
.splash-head{text-align:center;margin-bottom:26px}
.splash-head .k{font:600 11px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.title{font:700 40px/1.1 var(--disp);letter-spacing:-.02em;margin:6px 0 8px;color:var(--ink)}
.splash-head p{color:var(--mute);font-size:13.5px;max-width:38ch;margin:0 auto}
.pathcard{display:block;width:100%;text-align:left;padding:13px 14px;margin:0 0 9px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer}
.pathcard:hover{border-color:var(--acc);background:var(--panel2)}
.pathcard .row{align-items:flex-start}
.pathcard .ic{font-size:20px;flex:none}
.pathcard b{display:block;font:600 14.5px var(--disp);color:var(--ink)}
.pathcard .d{font-size:12.5px;color:var(--mute);margin-top:2px;line-height:1.4}
.pathcard .st2{font-size:11px;color:var(--info);margin-top:5px;font-family:var(--mono)}
</style>
</head>
<body>
<div id="app" class="wrap">
  <div id="splash"></div>
  <header id="hud" class="hud" hidden></header>
  <div id="ticker" class="ticker" hidden></div>
  <div id="autobar" class="autobar" hidden></div>
  <nav id="tabs" class="tabs" hidden></nav>
  <main id="view"></main>
</div>
<div id="modal" class="ov" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const rnd=Math.random;
const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const rf=(a,b)=>a+rnd()*(b-a);
const pick=a=>a[Math.floor(rnd()*a.length)];
const chance=p=>rnd()<p;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const poisson=l=>{if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rnd();}while(p>L&&k<60);return k-1;};
function wpick(items,wf){let t=0;const ws=items.map(i=>{const w=Math.max(0,wf(i));t+=w;return w;});if(t<=0)return items[0];let r=rnd()*t;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i];}return items[items.length-1];}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const neg=n<0;n=Math.abs(n);let s;if(n>=1e6)s=(n/1e6).toFixed(2)+'M';else if(n>=1000)s=Math.round(n).toLocaleString('en-US');else s=n.toFixed(2);return(neg?'-$':'$')+s;};
const cnum=n=>{const a=Math.abs(n);return a>=1000?Math.round(n).toLocaleString('en-US'):a>=1?n.toFixed(2):a>=0.01?n.toFixed(4):n.toFixed(6);};
const pfmt=p=>p>=100?'$'+Math.round(p).toLocaleString('en-US'):p>=1?'$'+p.toFixed(2):'$'+p.toFixed(4);
const sgn=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
const pct=n=>(n>=0?'+':'−')+Math.abs(n*100).toFixed(1)+'%';
function fill(t,c){return String(t).replace(/\{(\w+)\}/g,(m,k)=>c&&c[k]!==undefined?c[k]:m);}
function toast(t){const box=$('toasts');if(!box||!box.appendChild||typeof document.createElement!=='function')return;const d=document.createElement('div');d.className='toast';d.textContent=t;box.appendChild(d);setTimeout(()=>{try{d.remove();}catch(e){}},2600);}
/* ================= static data ================= */
const FIRST=['Amara','Luca','Mei','Diego','Fatima','Kofi','Yuki','Ravi','Ingrid','Tomasz','Chidi','Sofia','Omar','Priya','Jonas','Lucia','Hassan','Anya','Mateo','Nia','Bao','Camila','Dmitri','Esther','Farid','Greta','Hiro','Isabel','Jamal','Kavya','Leila','Marcus','Noor','Olga','Pablo','Quinn','Rosa','Sven','Tariq','Uma','Viktor','Wanjiru','Ximena','Yusuf','Zainab','Aiko','Bruno','Carmen','Deepak','Elif','Felix','Gabi','Hana','Idris','Julia','Khalid','Lena','Malik','Nadia','Oscar','Paloma','Rafael','Sana','Theo','Ulises','Vera','Wei','Yara','Zane','Beatriz','Callum','Dalia','Emeka','Freya','Gustavo','Ivan','Jasmine','Kwame','Lars','Minh','Nikolai','Ola','Petra','Reza','Siti','Tobias','Vikram','Willa','Xavier','Yasmin','Zoltan'];
const LAST=['Okafor','Tanaka','Silva','Novak','Haddad','Petrov','Nguyen','Garcia','Kowalski','Mensah','Lindqvist','Rahman','Fernandez','Bauer','Sato','Ivanov','Costa','Abadi','Murphy','Kim','Rossi','Adeyemi','Chen','Dubois','Hassan','Jensen','Kaplan','Lopez','Mbeki','Nasser','Olsen','Patel','Quispe','Reyes','Schmidt','Tran','Ueda','Varga','Wong','Yilmaz','Zhou','Abara','Brandt','Cruz','Dlamini','Eriksen','Farah','Gomez','Hoang','Ito'];
const H1=['moon','pixel','sat','block','hodl','chain','gas','ape','lambo','node','byte','ghost','salt','pepper','turbo','rusty','neon','sleepy','cosmic','tiny','quiet','spicy','lucky','frozen'];
const H2=['rat','wizard','fox','lord','goblin','monk','gremlin','pilot','panda','yeti','llama','bard','cactus','otter','crab','moth','owl','toad','sloth','walrus'];
const genHandle=()=>{const s=rnd();return s<.4?pick(H1)+'_'+pick(H2)+ri(1,99):s<.7?'xX'+pick(H1)+pick(H2)+'Xx':pick(H2)+ri(100,9999);};
const JOBS=['barista','freelance illustrator','night-shift nurse','warehouse lead','PhD student','food truck owner','accountant','indie game dev','wedding photographer','bus driver','high-school teacher','tattoo artist','retired sailor','call-center rep','urban beekeeper','fitness coach','locksmith','translator','ferry mechanic','app tester','florist','radio host','hotel night clerk','pastry chef'];
const QUIRKS=['Ends every message with "anyway."','Owns eleven hardware wallets and trusts none.','Says they only buy dips. Has never bought a dip.','Types with one finger, allegedly.','Signs messages like formal letters.','On their third "final" crypto comeback.','Keeps a spreadsheet for everything, including this.','Lost a wallet in a couch once. Still angry.','Asks about the weather before every purchase.','Collects rare bottle caps and rare tokens.','Treats every order like a heist movie.','Is always, somehow, at an airport.','Gets suspicious when things go smoothly.','Calls everyone "chief".','Only buys things on Tuesdays.','Has a cat named Satoshi. The cat is unimpressed.'];
const STYLES=[['plain',4],['lower',2],['emoji',2],['formal',1],['terse',1],['rambly',1],['caps',.4]];
const CORPS=['Northgate Freight','Lumen Labs','Harbor & Finch','PolarWorks','Cedar Ridge Capital','Tandem Robotics','Pinecone Media','Ardent Bank','Kiln Studios','Meridian Foods'];

const COINS={
  VLT:{n:'Vaultstable',p0:1,vol:.0012,drift:0,d:'A stablecoin. Boring on purpose.'},
  IRN:{n:'Ironcoin',p0:2400,vol:.032,drift:.0005,d:'The blue chip. Slow and stubborn.'},
  PBL:{n:'Pebble',p0:18,vol:.055,drift:.0003,d:'Mid-cap with an active dev team and worse habits.'},
  MCH:{n:'Mooncheese',p0:.042,vol:.13,drift:-.0006,d:'A meme coin. Numbers go up and down for no reason.'},
};
const COIN_W={VLT:.34,IRN:.26,PBL:.22,MCH:.18};

const CATS={
  cold:{n:'Cold storage',ic:'🔐',nouns:['seed-phrase steel plate','wallet sleeve','fireproof pouch','tamper-evident seals','micro safe','metal backup kit','stealth wallet case','faraday pouch']},
  merch:{n:'Merch',ic:'👕',nouns:['hoodie','beanie','sticker pack','enamel pin set','coffee mug','tote bag','phone case','desk mat','crew socks','poster tube']},
  rig:{n:'Mining gear',ic:'⛏️',nouns:['rig fan','GPU riser','open-air frame','power supply','thermal paste kit','rack shelf','noise dampener','cable organizer','PCIe adapter']},
  gadget:{n:'Gadgets',ic:'🔌',nouns:['mechanical keypad','LED light strip','smart plug','portable monitor','USB hub','webcam cover','wireless charger','desk lamp','ergonomic mouse']},
  game:{n:'Collectibles',ic:'🎮',nouns:['physical coin','arcade stick','card box','figurine','retro console','dice set','puzzle box','pixel art frame']},
  privacy:{n:'Privacy gear',ic:'🕶️',nouns:['RFID wallet','screen privacy filter','mic blocker','signal-blocking pouch','travel router','privacy laptop sleeve']},
};
const MODS=['Genesis','Satoshi-style','Midnight','Titan','Pocket','Pro','Ultra','Retro','Stealth','Founder\'s','Diamond-hands','Bull-run','Bear-proof','Minimalist','Overclocked','Vault','Nomad','Galaxy','Rugged','Zen','Alpha','Bunker','Hodler\'s','Block-party'];

function initMarket(){
  Object.entries(COINS).forEach(([sym,c])=>{
    S.coinHist[sym]=[c.p0];
    S.coinDaily[sym]=[c.p0];
    S.flags['p_'+sym]=c.p0;

function curPrice(sym){return S.flags['p_'+sym];}
function applyNewsMarket(ev){
  if(!ev.coin||!ev.amt) return;
  const syms = ev.coin==='ALL'? Object.keys(COINS) : [ev.coin];
  syms.forEach(sym=>{
    let p=S.flags['p_'+sym]*(1+ev.amt);
    if(sym==='VLT') p=clamp(p,0.9,1.1);
    p=Math.max(p, COINS[sym].p0*0.01);
    S.flags['p_'+sym]=p;
    S.coinHist[sym].push(p); if(S.coinHist[sym].length>150) S.coinHist[sym].shift();
  });
}
function snapshotDailyCoinPrices(){
  Object.keys(COINS).forEach(sym=>{
    S.coinDaily[sym]=S.coinDaily[sym]||[];
    S.coinDaily[sym].push(S.flags['p_'+sym]);
    if(S.coinDaily[sym].length>90) S.coinDaily[sym].shift();
  });
}
function buyCoin(sym,usd){
  const fee=tradeFee();
  const spend=Math.min(usd,S.cash);
  if(spend<=0) return;
  const p=curPrice(sym);
  const net=spend*(1-fee);
  const q=net/p;
  S.coins[sym]=(S.coins[sym]||0)+q;
  addCash(-spend);
  gainXP('trading',Math.max(1,Math.round(spend/40)));
  addLog(`Bought ${cnum(q)} ${sym} for ${money(spend)}.`);
}
function sellCoin(sym,qty){
  qty=Math.min(qty,S.coins[sym]||0);
  if(qty<=0) return;
  const fee=tradeFee();
  const p=curPrice(sym);
  const gross=qty*p;
  const net=gross*(1-fee);
  S.coins[sym]-=qty; if(S.coins[sym]<1e-9) delete S.coins[sym];
  addCash(net);
  gainXP('trading',Math.max(1,Math.round(gross/40)));
  addLog(`Sold ${cnum(qty)} ${sym} for ${money(net)}.`);
}
function tradeFee(){
  let f=0.012 - lv('trading')*0.0006;
  if(S.path==='teller') f-=0.004;
  if(hasGear('gateway')) f-=0.003;
  return clamp(f,0.001,0.03);
}

let tickTimer=null, cssCache={};
function cssVar(name){
  if(cssCache[name]) return cssCache[name];
  const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim();

}

    const chg = c.drift*0.05 + gauss()*c.vol*0.17;

    S.flags['p_'+sym]=p;
    const h=S.coinHist[sym]; h.push(p); if(h.length>150) h.shift();
  });
}

function drawChart(canvas,hist){
  if(!canvas || !hist || hist.length<2) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const w=canvas.clientWidth||parseInt(canvas.getAttribute('width'))||46;
  const h=canvas.clientHeight||parseInt(canvas.getAttribute('height'))||18;
  if(canvas._w!==w||canvas._h!==h||canvas._dpr!==dpr){
    canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
    canvas._w=w; canvas._h=h; canvas._dpr=dpr;
  }
  const ctx=canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const mn=Math.min(...hist),mx=Math.max(...hist),rng=(mx-mn)||(mn*0.001)||1;
  const step=w/(hist.length-1);
  const up=hist[hist.length-1]>=hist[0];
  ctx.beginPath();
  hist.forEach((v,i)=>{
    const x=i*step, y=h-((v-mn)/rng)*h*0.82-h*0.09;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = up? cssVar('--good') : cssVar('--bad');
  ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  // subtle fill
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
  ctx.fillStyle = up? cssVar('--good')+'14' : cssVar('--bad')+'14';
  try{ ctx.fillStyle = up? hexAlpha(cssVar('--good'),.12) : hexAlpha(cssVar('--bad'),.12); ctx.fill(); }catch(e){}
}
function hexAlpha(hex,a){
  hex=hex.trim();
  if(hex[0]!=='#') return hex;
  let r,g,b;
  if(hex.length===4){ r=parseInt(hex[1]+hex[1],16); g=parseInt(hex[2]+hex[2],16); b=parseInt(hex[3]+hex[3],16); }
  else { r=parseInt(hex.slice(1,3),16); g=parseInt(hex.slice(3,5),16); b=parseInt(hex.slice(5,7),16); }
  return `rgba(${r},${g},${b},${a})`;
}

function genProduct(tierBias=0){
  const catKeys=Object.keys(CATS);
  let tier=clamp(ri(0,2)+tierBias+(S.act>=2?ri(0,1):0)+(S.act>=3?ri(0,1):0),0,3);
  const cat=pick(catKeys);
  const C=CATS[cat];
  const noun=pick(C.nouns);
  const mod=tier>0&&chance(.7)?pick(MODS)+' ':'';
  const tm=TMOD[tier].length&&chance(.5)?pick(TMOD[tier])+' ':'';
  const sfx=pick(SUFX);
  const name=(tm||mod?(tm||mod):'')+cap(noun)+sfx;
  const [cmin,cmax]=TIERCOST[tier];
  const cost=+rf(cmin,cmax).toFixed(2);
  const [mmin,mmax]=TIERMK[tier];
  const sourceMk=rf(mmin,mmax);
  const demand=TD[tier]*rf(.75,1.3);
  const supplier=genSupplier(tier);
  return {id:++S.lastProdId,cat,tier,name,cost,supplier,baseDemand:demand,sourceMk};
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function genSupplier(tier){
  const flagChance=clamp(.22-lv('sourcing')*0.018-(S.act-1)*0.01,0.02,.3);
  const nFlags= chance(flagChance)? ri(1, tier>=2?3:2) : 0;
  const flags=shuffle(SUP_FLAGS).slice(0,nFlags);
  const scam = nFlags>=2 && chance(.55);
  return {
    name:pick(SUP_A)+' '+pick(SUP_B)+' '+pick(SUP_C),
    flags, scam,
    reliability: scam? rf(.1,.3): rf(.62,.98),
  };
}
function researchCost(){return Math.max(1,3-Math.floor(lv('sourcing')/4));}
function priceSuggest(p){
  let mk=p.sourceMk;
  mk*= 1+lv('haggle')*0.01;
  return +(p.cost*mk).toFixed(2);
}
function listProduct(p,price,cost){
  if(S.products.length>=slotsMax()){toast('No open store slots.');return false;}
  const initCost=cost;
  if(S.cash<initCost){toast('Not enough cash to stock it.');return false;}
  addCash(-initCost);
  S.products.push({id:p.id,cat:p.cat,tier:p.tier,name:p.name,cost:p.cost,price,stock:Math.round(initCost/p.cost),sold:0,age:0,supplier:p.supplier,baseDemand:p.baseDemand,flagged:p.supplier.flags.length>0});
  addLog(`Listed "${p.name}" at ${money(price)}.`);
  gainXP('sourcing',2);
  return true;
}
function restockCost(prod,qty){return +(prod.cost*qty).toFixed(2);}
function restock(prodId,qty){
  const p=S.products.find(x=>x.id===prodId); if(!p)return;
  const c=restockCost(p,qty);
  if(S.cash<c){toast('Not enough cash.');return;}
  addCash(-c); p.stock+=qty;
  addLog(`Restocked ${qty}x "${p.name}".`);
}
function delistProduct(prodId){
  const i=S.products.findIndex(x=>x.id===prodId); if(i<0)return;
  const p=S.products[i];
  const refund=p.stock*p.cost*0.4;
  addCash(refund);
  addLog(`Delisted "${p.name}", recovered ${money(refund)}.`);

function styleWrap(s,style){
  switch(style){
    case 'lower': return s.toLowerCase();
    case 'caps': return s.toUpperCase();
    case 'emoji': return s+' '+pick(['🙏','😅','🔥','👀','🙌','💀','✨','😬']);
    case 'formal': return s.replace(/^\w/,c=>c.toUpperCase());
    case 'terse': return s.split(' ').slice(0,Math.max(3,Math.floor(s.split(' ').length*0.6))).join(' ');
    default: return s;
  }
}

function chatOptions(th){

  const prod=S.products.find(p=>p.id===th.prodId);
  const opts=[];

function chatReply(th,action){
  const b=th.buyer; const prod=S.products.find(p=>p.id===th.prodId);
  if(!prod){ endChat(th,'lost','The listing disappeared mid-chat.'); return; }
  if(action==='flag'){
    if(b.scammer){
      endChat(th,'scamcaught','You reported them. Good call — that one was a scammer.');
      S.stats.scamsCaught++; gainXP('security',5); S.rep+=1;
    } else {
      endChat(th,'lost','False alarm — they were real, and now annoyed.');
      S.rep=Math.max(0,S.rep-1);
    }
    return;
  }
  let close = 0.34;
  close += lv('care')*0.02;
  if(action==='discount') close+=0.16;
  if(action==='firm') close-=0.05 + (b.budgetMood==='tight'?0.08:0);
  if(action==='pitch') close+=0.06;
  if(b.mood==='grumpy') close-=0.1;
  if(b.mood==='excited') close+=0.12;
  if(S.path==='clout') close+=0.05;
  th.patienceUsed=(th.patienceUsed||0)+1;
  if(b.scammer){
    // scammers eventually either get caught, ghost, or (if you fall for it) burn you
    if(action==='discount'||action==='pitch'||action==='firm'){
      if(th.patienceUsed>=2 && chance(.55)){
        pushMsg(th,'b',styleWrap(pick(SCAM_LINES),b.style));
      }
      if(th.patienceUsed>=3){
        if(chance(0.5-lv('security')*0.03)){
          // you get burned only if you actually ship without payment — handled via 'ship_first' option elsewhere; default safe path:
          pushMsg(th,'n','You sense something is off and stall on shipping details.');
          endChat(th,'lost','They stopped responding. Probably for the best.');
        } else {
          endChat(th,'lost','They vanish mid-conversation. Another one that got away — safely.');
        }
      } else {
        pushMsg(th,'b',styleWrap(pick(HAGGLE_LINES),b.style).replace(/\{p\}/,money(th.offerPrice)));
        render();
      }
      return;
    }
  }
  if(rnd()<close){
    const finalPrice = action==='discount'? +(th.askPrice*0.9).toFixed(2) : th.askPrice;
    pushMsg(th,'b',styleWrap(pick(ACCEPT_LINES),b.style));
    completeSale(th,prod,finalPrice);
  } else {
    if(th.patienceUsed>=b.patience){
      pushMsg(th,'b',styleWrap(pick(DECLINE_LINES),b.style));
      endChat(th,'lost','They left without buying.');
    } else {
      pushMsg(th,'b',styleWrap(fill(pick(HAGGLE_LINES),{p:money(Math.max(prod.cost*1.05,th.askPrice*rf(.75,.94)))}),b.style));
      render();
    }
  }
}
function completeSale(th,prod,price){
  const qty=Math.min(th.qty,prod.stock);
  if(qty<=0){ endChat(th,'lost','Out of stock right when they said yes. Brutal.'); return; }
  prod.stock-=qty; prod.sold+=qty;
  const total=+(price*qty).toFixed(2);
  const promised=S.day+ (hasGear('gateway')?ri(1,2):ri(1,3)) + gearLevel('batch');
  S.orders.push({id:++S.lastOrdId,buyer:th.buyer.handle,item:prod.name,qty,price:total,age:0,promised,prodId:prod.id});
  S.rep+=0.3*qty; S.hype=clamp(S.hype+1,0,100);
  S.stats.chats++;
  gainXP('marketing',2*qty); gainXP('care',1);
  th.done=true; th.stage='won';
  addLog(`Sold ${qty}x "${prod.name}" to @${th.buyer.handle} for ${money(total)} (unpaid order, awaiting fulfillment).`);
  render();
}
function endChat(th,stage,note){

  S.stats.chats++;
  render();
}

function packOrder(orderId){
  const o=S.orders.find(x=>x.id===orderId); if(!o||o.packed) return;
  o.packed=true;
  addLog(`Packed order #${o.id} (${o.item}) for @${o.buyer}.`);
  render();
}
function batchPack(){
  const avail=S.orders.filter(o=>!o.packed);
  avail.forEach(o=>o.packed=true);
  if(avail.length) addLog(`Packed all ${avail.length} open order${avail.length>1?'s':''}.`);
  else toast('Nothing to pack right now.');
  render();
}
function processOrdersEndOfDay(){
  let delivered=0, late=0, lost=0, earned=0;
  const remaining=[];
  S.orders.forEach(o=>{
    o.age++;
    const autopilot = hasGear('auto') && !o.packed && Math.random()<0.6;
    if(autopilot) o.packed=true;
    if(o.packed){
      const onTime = S.day<=o.promised;
      earned+=o.price;
      S.rep += onTime? 0.4 : -0.6;
      if(!onTime) late++;
      delivered++;
      S.stats.done+=1;
    } else if(S.day>o.promised+2){
      S.rep-=1.4; lost++;
    } else {
      remaining.push(o);
    }
  });
  S.orders=remaining;
  if(earned>0) addCash(earned);
  if(delivered) addLog(`${delivered} order${delivered>1?'s':''} delivered (+${money(earned)})${late?`, ${late} late`:''}.`);
  if(lost) addLog(`${lost} order${lost>1?'s':''} never shipped and were lost. Reputation took a hit.`);
  return {delivered,late,lost,earned};
}

function runStaffDaily(){
  if(!S.co||!S.co.staff.length) return;
  let payroll=0, log=[];
  let restocked=[];
  S.co.staff.forEach(e=>{
    payroll+=e.wage; e.days++;
    const sk=effSkill(e);
    if(e.role==='fulfil'){
      let n=Math.min(sk,S.orders.filter(o=>!o.packed).length);
      const mistake = e.trait==='sloppy'&&chance(.12);
      for(let i=0;i<n;i++){ const o=S.orders.filter(o=>!o.packed)[0]; if(o) o.packed=true; }
      if(mistake) S.rep-=1;
      // warehouse duties: keep shelves stocked
      const reserve=Math.max(60,payroll*2);
      S.products.forEach(p=>{
        const lowBar=2+Math.floor(sk/2);
        if(p.stock<lowBar){
          const qty=Math.max(4,sk*2);
          const cost=+(p.cost*qty).toFixed(2);
          if(S.cash-cost>=reserve){
            S.cash-=cost; p.stock+=qty;
            restocked.push(`${qty}x "${p.name}"`);
          }
        }
      });
    } else if(e.role==='support'){
      const open=S.inbox.filter(t=>!t.done);
      let n=Math.min(Math.ceil(sk/2),open.length);
      for(let i=0;i<n;i++){ const th=open[i]; const prod=S.products.find(p=>p.id===th.prodId);
        if(prod && chance(0.3+sk*0.05) && !th.buyer.scammer){ completeSale(th,prod,th.askPrice); }
        else { endChat(th,'lost','Support handled it — no sale, but resolved.'); }
      }
    } else if(e.role==='scout'){
      if(chance(0.25+sk*0.05)&&S.leads.length<6) S.leads.push(genProduct(1));
    } else if(e.role==='growth'){
      S.hype=clamp(S.hype+sk*0.6,0,100);
    } else if(e.role==='books'){
      // handled in tax calc
    } else if(e.role==='sec'){
      // handled in scam calc
    }
    if(e.trait==='ambitious'&&e.days%30===0){ e.wage=Math.round(e.wage*1.12); log.push(`${e.name} asked for (and got) a raise.`); }
    if(e.trait==='gossip'){ S.co.morale=clamp(S.co.morale+ri(-2,2),0,100); }
  });
  S.co.morale=clamp(S.co.morale + (S.cash>0?0.4:-1.5),0,100);
  if(S.cash<payroll){ S.co.morale=clamp(S.co.morale-10,0,100); log.push('Payroll came up short. Morale dropped hard.'); }
  else addCash(-payroll);
  if(payroll) addLog(`Paid payroll: ${money(payroll)}.`+(log.length?' '+log.join(' '):''));
  if(restocked.length) addLog(`Warehouse restocked: ${restocked.join(', ')}.`);
  if(S.co.morale<25 && chance(.1)){
    const q=S.co.staff[ri(0,S.co.staff.length-1)];
    if(q){ S.co.staff=S.co.staff.filter(e=>e.id!==q.id); addLog(`${q.name} quit. Morale was too low.`); }
  }
}

function rent(){

function taxRate(){
  let t=0.06 - lv('law')*0.003 - (S.co&&S.co.staff.some(e=>e.role==='books')?0.02:0);
  return clamp(t,0.01,0.06);
}
function endDay(){
  if(S.energy>0 && !confirm2()) { /* no-op, handled by UI confirm before calling */ }
  runStaffDaily();
  const res=processOrdersEndOfDay();
  snapshotDailyCoinPrices();
  const n=dailyNews();
  const r=rent();
  if(r>0) addCash(-r);
  const tax = Math.max(0, S.stats.earned>0 ? Math.round((res.earned||0)*taxRate()) : 0);
  if(tax>0){ addCash(-tax); }
  addStress(3 - (S.stress>70?0:0));
  S.stress=clamp(S.stress-2+ (S.orders.filter(o=>!o.packed).length*0.6),0,S.maxStress);
  S.hype=clamp(S.hype-4,0,100);
  // buyer chat logs clear themselves out at the end of each day
  S.inbox=S.inbox.filter(t=>!t.done);
  // stress consequence
  if(S.stress>=95 && chance(.35)){
    addLog('You crash for a full day. Nothing gets done.'); S.energy=0; S.flags.forcedRest=true;
  }
  checkAchievements();
  S.day++;
  S.energy=energyMax();
  S.gigsToday=0;
  S.gig=null;
  S.phase='work';
  maybeAdvanceStory();
  if(!S.pendingEvent){
    const ev=tryRandomEvent();
    if(ev) queueRandomEvent(ev);
  }
  render();
  if(S.pendingEvent) openEventModal();
  else if(rnd()<0.001){} // noop
}

const AUTO_KEY='dh_auto_v1';
const SPEEDS={slow:{ms:30000,label:'Slow'},norm:{ms:14000,label:'Normal'},fast:{ms:6000,label:'Fast'}};
let autoState={on:false,speed:'norm',remain:SPEEDS.norm.ms};
function loadAutoPrefs(){
  try{ const s=JSON.parse(localStorage.getItem(AUTO_KEY)||'null'); if(s){ autoState.on=!!s.on; autoState.speed=s.speed||'norm'; } }catch(e){}
  autoState.remain=SPEEDS[autoState.speed].ms;
}
function saveAutoPrefs(){ try{ localStorage.setItem(AUTO_KEY,JSON.stringify({on:autoState.on,speed:autoState.speed})); }catch(e){} }

function renderAutoBar(){
  const box=$('autobar'); if(!box) return;
  box.hidden=false;
  box.innerHTML=`
    <button class="autobtn ${autoState.on?'on':''}" id="autotoggle" title="Toggle auto-advance">${autoState.on?'⏸':'▶'}</button>
    <span id="autolabel">${autoState.on?'Auto-advancing':'Manual'}</span>
    <div class="prog"><i id="autoprog"></i></div>
    <div class="spdsel" id="spdsel">
      ${Object.entries(SPEEDS).map(([k,v])=>`<button data-spd="${k}" class="${autoState.speed===k?'on':''}">${v.label}</button>`).join('')}
    </div>`;
  $('autotoggle').onclick=()=>{ autoState.on=!autoState.on; autoState.remain=SPEEDS[autoState.speed].ms; saveAutoPrefs(); renderAutoBar(); };
  box.querySelectorAll('[data-spd]').forEach(b=>b.onclick=()=>{ autoState.speed=b.dataset.spd; autoState.remain=SPEEDS[autoState.speed].ms; saveAutoPrefs(); renderAutoBar(); });
}
function modalOpen(){ const m=$('modal'); return m && !m.hidden; }
function stepAutoDay(){
  const prog=$('autoprog'); const label=$('autolabel');
  if(!autoState.on){ if(prog) prog.style.width='0%'; if(label) label.textContent='Manual'; return; }
  if(modalOpen()){ if(label) label.textContent='Paused — resolve the popup'; return; }
  if(label) label.textContent='Auto-advancing';
  autoState.remain-=TICK_MS;
  const total=SPEEDS[autoState.speed].ms;
  const p=clamp(100-(autoState.remain/total*100),0,100);
  if(prog) prog.style.width=p+'%';
  if(autoState.remain<=0){
    autoState.remain=total;
    endDay();
  }
}

    for(let i=0;i<n;i++) found.push(genProduct());
    S.leads=found;
    addLog(`Researched ${n} new product leads.`);
    render();
  };
  qa('[data-list]').forEach(b=>b.onclick=()=>{
    const p=S.leads[+b.dataset.list];
    const price=priceSuggest(p);
    const startQty=Math.max(3,Math.round(60/p.cost));
    const cost=+(p.cost*startQty).toFixed(2);
    if(listProduct(p,price,cost)){ S.leads=S.leads.filter(x=>x!==p); render(); }
  });
  qa('[data-drop]').forEach(b=>b.onclick=()=>{ S.leads.splice(+b.dataset.drop,1); render(); });

  qa('[data-restock]').forEach(b=>b.onclick=()=>{ openRestock(+b.dataset.restock); });
  qa('[data-delist]').forEach(b=>b.onclick=()=>{ if(confirm('Delist this product? You\'ll recover part of the stock cost.')) delistProduct(+b.dataset.delist); render(); });
  qa('[data-promo]').forEach(b=>b.onclick=()=>{ runPromo(PROMOS.find(p=>p.id===b.dataset.promo)); });
  const fg=q('#findgig'); if(fg) fg.onclick=()=>{ rollGig(); render(); };
  const dg=q('#dogig'); if(dg) dg.onclick=()=>doGig();
  const sg=q('#skipgig'); if(sg) sg.onclick=()=>{S.gig=null; render();};
  const rb=q('#rest'); if(rb) rb.onclick=()=>{

function boot(skipIntro,introPath){
  $('splash').innerHTML='';
  $('hud').hidden=false; $('tabs').hidden=false;
  activeTab='work';
  loadAutoPrefs();
  renderTickerShell();
  renderAutoBar();
  startLiveLoop();
  render();
  if(!skipIntro && introPath){
    showModal(`<div class="story"><h2>${esc(INTROS[introPath].title)}</h2><p style="white-space:pre-line">${esc(introText(introPath))}</p></div>`);
  }
}
window.addEventListener('DOMContentLoaded',()=>{ renderSplash(); });
</script></body></html>
