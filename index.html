<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Drift · 3D Arcade Racer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background-color: #0a0a1a;
            color: white;
            user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 15px 25px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 220px;
        }
        #speed {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            line-height: 1;
        }
        #speed span {
            font-size: 16px;
            font-weight: 400;
            color: #aaa;
            margin-left: 5px;
        }
        #gear {
            font-size: 24px;
            font-weight: 700;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
        }
        #timer {
            font-size: 26px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        #drift-score {
            font-size: 22px;
            font-weight: 700;
            color: #ff44ff;
            text-shadow: 0 0 15px #ff44ff;
            transition: transform 0.1s;
        }
        #drift-mult {
            font-size: 18px;
            color: #ffaa44;
            text-shadow: 0 0 10px #ffaa44;
        }
        #progress-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: none;
        }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            border-radius: 10px;
            transition: width 0.1s;
            box-shadow: 0 0 20px #00ffff;
        }
        /* Menus */
        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(10, 10, 30, 0.9), rgba(0, 0, 0, 0.95));
            backdrop-filter: blur(10px);
            pointer-events: auto;
            z-index: 20;
            transition: opacity 0.3s;
        }
        .menu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .menu h1 {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            margin-bottom: 30px;
            letter-spacing: 5px;
        }
        .menu h2 {
            font-size: 28px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 700px;
            width: 90%;
        }
        .btn {
            background: rgba(20, 20, 40, 0.8);
            border: 2px solid #00ffff;
            color: #fff;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            pointer-events: auto;
        }
        .btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }
        .btn.secondary {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.2);
        }
        .btn.secondary:hover {
            background: rgba(255, 0, 255, 0.2);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.6);
        }
        .btn.small {
            font-size: 16px;
            padding: 12px 18px;
        }
        /* Garage */
        #garage-menu .garage-panel {
            display: flex;
            gap: 30px;
            background: rgba(10, 10, 30, 0.8);
            border-radius: 30px;
            padding: 30px 40px;
            border: 1px solid #00ffff;
            backdrop-filter: blur(10px);
        }
        .garage-column {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .garage-column label {
            font-size: 14px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: transform 0.1s;
            pointer-events: auto;
        }
        .color-swatch:hover {
            transform: scale(1.2);
        }
        .color-swatch.selected {
            border: 3px solid #fff;
            box-shadow: 0 0 20px currentColor;
        }
        .swatch-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        /* Leaderboard */
        .leaderboard {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #ffaa00;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }
        .leaderboard h3 {
            color: #ffaa00;
            margin: 0 0 10px 0;
            text-align: center;
        }
        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            font-family: monospace;
            font-size: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .leaderboard-entry .medal {
            font-weight: 700;
        }
        .medal-gold { color: #ffd700; }
        .medal-silver { color: #c0c0c0; }
        .medal-bronze { color: #cd7f32; }
        .medal-author { color: #ff00ff; }
        .medal-player { color: #00ffff; }
        /* Split delta */
        #split-delta {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 0, 0.5);
            font-family: 'Courier New', monospace;
            font-size: 22px;
            color: #fff;
            pointer-events: none;
        }
        #split-delta .delta-positive { color: #00ff88; }
        #split-delta .delta-negative { color: #ff4444; }
        #respawn-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <!-- HUD -->
        <div id="hud" style="display: none;">
            <div id="speed">0 <span>KM/H</span></div>
            <div id="gear">N</div>
            <div id="timer">00:00.000</div>
            <div id="drift-score">0</div>
            <div id="drift-mult">x1.0</div>
        </div>
        <div id="split-delta" style="display: none;"></div>
        <div id="progress-bar" style="display: none;">
            <div id="progress-fill"></div>
        </div>
        <div id="respawn-hint" style="display: none;">R = Respawn · Backspace = Restart</div>

        <!-- Main Menu -->
        <div id="main-menu" class="menu">
            <h1>NEON DRIFT</h1>
            <h2>Select a track</h2>
            <div class="button-grid">
                <button class="btn" data-track="0">01 · Poly Oval</button>
                <button class="btn" data-track="1">02 · Skyway Jumps</button>
                <button class="btn" data-track="2">03 · Drift Canyon</button>
                <button class="btn" data-track="3">04 · Neon Gauntlet</button>
            </div>
            <div style="margin-top: 20px;">
                <button id="garage-btn" class="btn secondary small">🔧 Garage</button>
            </div>
            <div class="leaderboard" id="menu-leaderboard">
                <h3>🏆 Track 01 · Poly Oval</h3>
                <div id="leaderboard-content"></div>
            </div>
        </div>

        <!-- Garage Menu -->
        <div id="garage-menu" class="menu hidden">
            <h1 style="font-size: 42px;">GARAGE</h1>
            <div class="garage-panel">
                <div class="garage-column">
                    <label>Body Style</label>
                    <button class="btn small" id="body-super">Sleek Supercar</button>
                    <button class="btn small" id="body-coupe">Drift Coupe</button>
                    <button class="btn small" id="body-formula">Open-Wheel</button>
                </div>
                <div class="garage-column">
                    <label>Primary Color</label>
                    <div class="swatch-row" id="primary-swatches"></div>
                    <label>Secondary Accent</label>
                    <div class="swatch-row" id="secondary-swatches"></div>
                    <label>Rim Color</label>
                    <div class="swatch-row" id="rim-swatches"></div>
                </div>
                <div class="garage-column">
                    <label>Underglow</label>
                    <div class="swatch-row" id="underglow-swatches"></div>
                    <label>Drift Smoke</label>
                    <div class="swatch-row" id="smoke-swatches"></div>
                    <label>Handling</label>
                    <button class="btn small" id="handling-grip">Grip Setup</button>
                    <button class="btn small" id="handling-drift">Drift Setup</button>
                </div>
            </div>
            <button id="garage-back" class="btn secondary" style="margin-top: 30px;">← Back to Menu</button>
        </div>

        <!-- Results Menu -->
        <div id="results-menu" class="menu hidden">
            <h1 style="font-size: 42px;">RESULTS</h1>
            <div id="results-content" style="font-size: 24px; text-align: center; line-height: 2;">
            </div>
            <div style="margin-top: 30px; display: flex; gap: 20px;">
                <button id="results-retry" class="btn">Retry</button>
                <button id="results-menu-btn" class="btn secondary">Main Menu</button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================================
        // ARCHITECTURE OUTLINE
        // ============================================================
        // 1. State Manager: gameState ('menu', 'garage', 'racing', 'results')
        //    with current track index, mode (time-attack, drift, endurance),
        //    car config, and leaderboard data persisted in localStorage.
        // 2. Physics Loop: custom arcade car physics with box colliders,
        //    velocity, drift angle, boost pads, ramps (height sampling),
        //    checkpoint respawn, and lap counting.
        // 3. Track Generator: modular track builder using segment arrays.
        //    Each track is built from boxes, ramps, boost pads, checkpoints,
        //    and finish gates. Collision detection is AABB-based against
        //    track geometry and special blocks.
        // 4. Audio Synthesizer: Web Audio API procedural engine sound,
        //    tire screech, boost whoosh, checkpoint chime, and drift score.
        // ============================================================

        // ============================================================
        // GLOBAL SETUP
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404060, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -300;
        dirLight.shadow.camera.right = 300;
        dirLight.shadow.camera.top = 300;
        dirLight.shadow.camera.bottom = -300;
        dirLight.shadow.camera.far = 500;
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x4466ff, 0.4);
        fillLight.position.set(-100, 100, -100);
        scene.add(fillLight);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        // STATE MANAGER
        // ============================================================
        const State = {
            screen: 'menu', // 'menu', 'garage', 'racing', 'results'
            trackIndex: 0,
            mode: 'time-attack', // 'time-attack', 'drift', 'endurance'
            carConfig: {
                bodyStyle: 'super', // 'super', 'coupe', 'formula'
                primaryColor: '#00aaff',
                secondaryColor: '#ffffff',
                rimColor: '#ffaa00',
                underglow: '#00ffff',
                smokeColor: '#ff00ff',
                handling: 'grip' // 'grip' or 'drift'
            },
            leaderboards: {},
            personalBests: {},
            ghostFrames: [],
            bestGhost: null,
            raceData: {
                startTime: 0,
                currentLap: 0,
                totalLaps: 3,
                checkpoints: [],
                lastCheckpoint: 0,
                driftScore: 0,
                driftMultiplier: 1,
                driftTimer: 0,
                isDrifting: false,
                driftBanked: 0,
                splitDeltas: [],
                finishTime: 0
            }
        };

        // Load from localStorage
        function loadLeaderboards() {
            const saved = localStorage.getItem('neonDriftLeaderboards');
            if (saved) {
                State.leaderboards = JSON.parse(saved);
            } else {
                // Pre-populate with AI ghost times
                const defaultLBs = {};
                for (let i = 0; i < 4; i++) {
                    defaultLBs[i] = {
                        times: [ // gold, silver, bronze, author (seconds)
                            [62.5, 58.2, 54.8, 51.3][i] || 60,
                            [85.3, 78.1, 72.4, 66.9][i] || 80,
                            [95.7, 88.4, 81.2, 74.6][i] || 90,
                            [120.4, 110.2, 102.8, 94.5][i] || 115
                        ][i] || 60,
                        scores: [
                            [4500, 6200, 8100, 10500][i] || 5000,
                            [6800, 8900, 11200, 14000][i] || 7000,
                            [8200, 10800, 13500, 16800][i] || 9000,
                            [7200, 9500, 12000, 15200][i] || 8000
                        ][i] || 5000
                    };
                }
                State.leaderboards = defaultLBs;
                localStorage.setItem('neonDriftLeaderboards', JSON.stringify(defaultLBs));
            }
            const savedPB = localStorage.getItem('neonDriftPersonalBests');
            if (savedPB) State.personalBests = JSON.parse(savedPB);
        }

        function saveLeaderboards() {
            localStorage.setItem('neonDriftLeaderboards', JSON.stringify(State.leaderboards));
            localStorage.setItem('neonDriftPersonalBests', JSON.stringify(State.personalBests));
        }

        function loadCarConfig() {
            const saved = localStorage.getItem('neonDriftCarConfig');
            if (saved) {
                State.carConfig = JSON.parse(saved);
            }
        }

        function saveCarConfig() {
            localStorage.setItem('neonDriftCarConfig', JSON.stringify(State.carConfig));
        }

        loadLeaderboards();
        loadCarConfig();

        // ============================================================
        // TRACK BUILDER
        // ============================================================
        class TrackBuilder {
            constructor() {
                this.group = new THREE.Group();
                this.colliders = []; // { position, size, type, data }
                this.checkpoints = [];
                this.boostPads = [];
                this.ramps = [];
                this.startPos = new THREE.Vector3(0, 1, 0);
                this.startRot = 0;
                this.finishGate = null;
                this.trackLength = 0;
            }

            addBox(x, y, z, w, h, d, color, rotY = 0) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6, metalness: 0.1 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.rotation.y = rotY;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                this.group.add(mesh);
                this.colliders.push({
                    position: new THREE.Vector3(x, y, z),
                    size: new THREE.Vector3(w, h, d),
                    type: 'box',
                    rotY: rotY
                });
                return mesh;
            }

            addRamp(x, y, z, w, h, d, color, rotY = 0, tilt = 0.3) {
                // Ramp: a sloped box. Use a box with rotation.x
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.2 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.rotation.y = rotY;
                mesh.rotation.x = tilt;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                this.group.add(mesh);
                this.colliders.push({
                    position: new THREE.Vector3(x, y, z),
                    size: new THREE.Vector3(w, h, d),
                    type: 'ramp',
                    rotY: rotY,
                    tilt: tilt
                });
                this.ramps.push({ position: new THREE.Vector3(x, y, z), size: new THREE.Vector3(w, h, d), rotY, tilt });
                return mesh;
            }

            addBoostPad(x, y, z, w, h, d, rotY = 0) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x00ffff,
                    emissive: 0x00ffff,
                    emissiveIntensity: 1.5,
                    roughness: 0.2,
                    metalness: 0.8
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.rotation.y = rotY;
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                this.group.add(mesh);
                // Add chevron arrows on top
                const arrowGeo = new THREE.ConeGeometry(0.8, 1.2, 4);
                const arrowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 });
                for (let i = -1; i <= 1; i++) {
                    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
                    arrow.rotation.x = Math.PI / 2;
                    arrow.rotation.y = rotY;
                    arrow.position.set(
                        x + Math.sin(rotY) * i * 2,
                        y + 0.6,
                        z + Math.cos(rotY) * i * 2
                    );
                    arrow.scale.set(0.8, 0.8, 0.8);
                    this.group.add(arrow);
                }
                this.boostPads.push({ position: new THREE.Vector3(x, y, z), size: new THREE.Vector3(w, h, d), rotY });
                return mesh;
            }

            addCheckpoint(x, y, z, rotY = 0, index = 0) {
                const archGroup = new THREE.Group();
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x00ffaa, emissive: 0x00ffaa, emissiveIntensity: 0.8 });
                const barMat = new THREE.MeshStandardMaterial({ color: 0x00ffaa, emissive: 0x00ffaa, emissiveIntensity: 1.2 });
                const pillarGeo = new THREE.CylinderGeometry(0.4, 0.4, 6, 8);
                const barGeo = new THREE.BoxGeometry(8, 0.5, 0.5);
                const left = new THREE.Mesh(pillarGeo, pillarMat);
                left.position.set(-4, 3, 0);
                left.castShadow = true;
                archGroup.add(left);
                const right = new THREE.Mesh(pillarGeo, pillarMat);
                right.position.set(4, 3, 0);
                right.castShadow = true;
                archGroup.add(right);
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.set(0, 6, 0);
                bar.castShadow = true;
                archGroup.add(bar);
                archGroup.position.set(x, y, z);
                archGroup.rotation.y = rotY;
                this.group.add(archGroup);
                this.checkpoints.push({
                    position: new THREE.Vector3(x, y, z),
                    rotY: rotY,
                    index: index,
                    radius: 6
                });
                return archGroup;
            }

            addFinishGate(x, y, z, rotY = 0) {
                const gateGroup = new THREE.Group();
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.8 });
                const barMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 1.5 });
                const pillarGeo = new THREE.CylinderGeometry(0.6, 0.6, 8, 8);
                const barGeo = new THREE.BoxGeometry(12, 0.8, 0.8);
                const left = new THREE.Mesh(pillarGeo, pillarMat);
                left.position.set(-6, 4, 0);
                left.castShadow = true;
                gateGroup.add(left);
                const right = new THREE.Mesh(pillarGeo, pillarMat);
                right.position.set(6, 4, 0);
                right.castShadow = true;
                gateGroup.add(right);
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.set(0, 8, 0);
                bar.castShadow = true;
                gateGroup.add(bar);
                gateGroup.position.set(x, y, z);
                gateGroup.rotation.y = rotY;
                this.group.add(gateGroup);
                this.finishGate = { position: new THREE.Vector3(x, y, z), rotY: rotY, radius: 8 };
                return gateGroup;
            }

            addDecor(x, y, z, color) {
                const geo = new THREE.OctahedronGeometry(1.5);
                const mat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.3, roughness: 0.4 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                this.group.add(mesh);
                return mesh;
            }
        }

        // ============================================================
        // TRACK DEFINITIONS
        // ============================================================
        const TRACKS = [
            {
                name: 'Poly Oval',
                build: (tb) => {
                    // Wide oval track with banked turns (simulated with flat turns + ramps)
                    const color = 0x1a3a5a;
                    const accent = 0x00aaff;
                    // Straight sections
                    tb.addBox(0, 0, -80, 20, 1, 160, color); // main straight
                    tb.addBox(0, 0, 80, 20, 1, 160, color);
                    tb.addBox(-60, 0, -160, 140, 1, 20, color); // top curve
                    tb.addBox(60, 0, 160, 140, 1, 20, color); // bottom curve
                    // Banked turn approximations
                    tb.addBox(-80, 2, -80, 20, 1, 100, 0x224466, 0.4);
                    tb.addBox(80, 2, 80, 20, 1, 100, 0x224466, -0.4);
                    // Boost pads on straights
                    tb.addBoostPad(0, 0.6, -120, 10, 0.2, 30);
                    tb.addBoostPad(0, 0.6, 120, 10, 0.2, 30);
                    // Ramps for airtime

        // ============================================================
        // AUDIO SYNTHESIZER
        // ============================================================
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let engineFilter = null;
        let screechOsc = null;
        let screechGain = null;
        let boostNoise = null;
        let boostGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // Engine sound
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.value = 60;
            engineGain = audioCtx.createGain();
            engineGain.gain.value = 0.08;
            engineFilter = audioCtx.createBiquadFilter();
            engineFilter.type = 'lowpass';
            engineFilter.frequency.value = 800;
            engineOsc.connect(engineFilter);
            engineFilter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
            // Tire screech
            screechOsc = audioCtx.createOscillator();
            screechOsc.type = 'sawtooth';
            screechOsc.frequency.value = 800;
            screechGain = audioCtx.createGain();
            screechGain.gain.value = 0;
            screechOsc.connect(screechGain);
            screechGain.connect(audioCtx.destination);
            screechOsc.start();
            // Boost noise
            boostNoise = audioCtx.createBufferSource();
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            boostNoise.buffer = buffer;
            boostGain = audioCtx.createGain();
            boostGain.gain.value = 0;
            boostNoise.connect(boostGain);
            boostGain.connect(audioCtx.destination);
            boostNoise.start();
        }

        function updateAudio(speed, rpm, drifting, boosting) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            // Engine pitch
            const freq = 60 + rpm * 400;
            engineOsc.frequency.linearRampToValueAtTime(freq, now + 0.05);
            engineGain.gain.linearRampToValueAtTime(0.05 + rpm * 0.08, now + 0.05);
            engineFilter.frequency.linearRampToValueAtTime(400 + rpm * 2000, now + 0.05);
            // Tire screech
            if (drifting) {
                screechGain.gain.linearRampToValueAtTime(0.06, now + 0.05);
                screechOsc.frequency.linearRampToValueAtTime(600 + Math.random() * 400, now + 0.02);
            } else {
                screechGain.gain.linearRampToValueAtTime(0, now + 0.1);
            }
            // Boost
            if (boosting) {
                boostGain.gain.linearRampToValueAtTime(0.15, now + 0.05);
            } else {
                boostGain.gain.linearRampToValueAtTime(0, now + 0.1);
            }
        }

        function playCheckpointChime() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.value = 0.1;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // ============================================================
        // CAR MODEL
        // ============================================================
        function createCarModel(config) {
            const group = new THREE.Group();
            const primary = new THREE.Color(config.primaryColor);
            const secondary = new THREE.Color(config.secondaryColor);
            const rim = new THREE.Color(config.rimColor);

            // Body based on style
            let bodyGeo;
            if (config.bodyStyle === 'super') {
                bodyGeo = new THREE.BoxGeometry(2.2, 0.6, 5.0);
            } else if (config.bodyStyle === 'coupe') {
                bodyGeo = new THREE.BoxGeometry(2.0, 0.7, 4.5);
            } else {
                // formula
                bodyGeo = new THREE.BoxGeometry(1.8, 0.5, 4.8);
            }
            const bodyMat = new THREE.MeshStandardMaterial({ color: primary, roughness: 0.4, metalness: 0.6 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Cabin
            const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 2.0);
            const cabinMat = new THREE.MeshStandardMaterial({ color: secondary, roughness: 0.3, metalness: 0.5 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.25, -0.3);
            cabin.castShadow = true;
            group.add(cabin);

            // Spoiler
            const spoilerGeo = new THREE.BoxGeometry(2.0, 0.1, 0.6);
            const spoilerMat = new THREE.MeshStandardMaterial({ color: secondary, roughness: 0.4, metalness: 0.7 });
            const spoiler = new THREE.Mesh(spoilerGeo, spoilerMat);
            spoiler.position.set(0, 1.3, 2.0);
            spoiler.castShadow = true;
            group.add(spoiler);

            // Wheels
            const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12);
            const wheelMat = new THREE.MeshStandardMaterial({ color: rim, roughness: 0.3, metalness: 0.9 });
            const positions = [
                [-1.1, 0.5, 1.5], [1.1, 0.5, 1.5],
                [-1.1, 0.5, -1.5], [1.1, 0.5, -1.5]
            ];
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                wheel.castShadow = true;
                group.add(wheel);
            });

            // Underglow
            const glowGeo = new THREE.BoxGeometry(2.6, 0.1, 5.4);
            const glowMat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(config.underglow),
                emissive: new THREE.Color(config.underglow),
                emissiveIntensity: 2.0,
                transparent: true,
                opacity: 0.6
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.y = 0.3;
            group.add(glow);

            // Headlights
            const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.2);
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2 });
            const leftLight = new THREE.Mesh(lightGeo, lightMat);
            leftLight.position.set(-0.7, 0.9, -2.5);
            group.add(leftLight);
            const rightLight = new THREE.Mesh(lightGeo, lightMat);
            rightLight.position.set(0.7, 0.9, -2.5);
            group.add(rightLight);

            return group;
        }

        // ============================================================
        // GAME ENGINE (Physics, Rendering, State Transitions)
        // ============================================================
        let currentTrack = null;
        let car = null;
        let carModel = null;
        let ghostModel = null;

        let speedLines = [];

        const carState = {
            position: new THREE.Vector3(0, 2, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            rotation: 0,
            angularVelocity: 0,
            speed: 0,
            driftAngle: 0,

            boostTimer: 0,
            driftScore: 0,

        // Input
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;

        // Race timer
        let raceStartTime = 0;

        let ghostFrames = [];

        // Menu / UI elements
        const mainMenu = document.getElementById('main-menu');
        const garageMenu = document.getElementById('garage-menu');

        const hud = document.getElementById('hud');

        // Build the selected track
        function loadTrack(index) {
            State.trackIndex = index;
            // Clear scene (keep lights and camera)
            if (currentTrack) {
                scene.remove(currentTrack.group);
                // Remove car
                if (carModel) scene.remove(carModel);
                if (ghostModel) scene.remove(ghostModel);
                // Remove particles
                particles.forEach(p => scene.remove(p.mesh));
                particles = [];
            }
            const tb = new TrackBuilder();
            TRACKS[index].build(tb);
            currentTrack = tb;
            scene.add(tb.group);

            // Position car at start
            carState.position.copy(tb.startPos);
            carState.velocity.set(0, 0, 0);
            carState.rotation = tb.startRot;
            carState.lap = 0;
            carState.checkpointIndex = 0;
            carState.finished = false;
            carState.finishTime = 0;
            carState.driftScore = 0;
            carState.driftMultiplier = 1;
            carState.lastCheckpointPos.copy(tb.startPos);
            carState.lastCheckpointRot = tb.startRot;
            carState.ghostFrames = [];

            // Create car model
            if (carModel) scene.remove(carModel);
            carModel = createCarModel(State.carConfig);
            carModel.position.copy(carState.position);
            carModel.rotation.y = carState.rotation;
            scene.add(carModel);

            // Ghost model (semi-transparent copy)
            if (ghostModel) scene.remove(ghostModel);
            ghostModel = createCarModel(State.carConfig);
            ghostModel.traverse(child => {
                if (child.isMesh) {
                    child.material.transparent = true;
                    child.material.opacity = 0.35;
                    child.material.emissive = new THREE.Color(0x00ffff);
                    child.material.emissiveIntensity = 0.3;
                }
            });
            ghostModel.visible = false;
            scene.add(ghostModel);

            // Reset camera
            camera.position.copy(carState.position).add(new THREE.Vector3(0, 8, 15));
            camera.lookAt(carState.position);
        }

        // Start a race
        function startRace(trackIndex, mode = 'time-attack') {
            initAudio();
            State.mode = mode;
            State.trackIndex = trackIndex;
            loadTrack(trackIndex);
            State.screen = 'racing';
            raceStartTime = performance.now();
            currentTime = 0;
            bestLapTime = Infinity;
            lastFrameTime = performance.now();

            // Load ghost frames from personal best
            const pbKey = `track_${trackIndex}`;
            if (State.personalBests[pbKey]) {
                const ghostData = State.personalBests[pbKey].ghostFrames;
                if (ghostData && ghostData.length > 0) {
                    carState.ghostFrames = ghostData;
                    ghostModel.visible = true;
                } else {
                    ghostModel.visible = false;
                }
            } else {
                ghostModel.visible = false;
            }

            // Show HUD
            hud.style.display = 'block';
            progressBar.style.display = 'block';
            splitDelta.style.display = 'block';
            respawnHint.style.display = 'block';
            mainMenu.classList.add('hidden');
            garageMenu.classList.add('hidden');
            resultsMenu.classList.add('hidden');
        }

        function finishRace() {
            carState.finished = true;
            carState.finishTime = currentTime;
            State.screen = 'results';

            // Save personal best
            const trackKey = `track_${State.trackIndex}`;
            const modeKey = State.mode;
            const time = currentTime / 1000;

            if (!State.personalBests[trackKey]) State.personalBests[trackKey] = {};
            const pb = State.personalBests[trackKey];
            const isNewPB = !pb[modeKey] || time < pb[modeKey].time;

            if (isNewPB) {
                pb[modeKey] = {
                    time: time,
                    ghostFrames: carState.ghostFrames.slice(), // copy
                    driftScore: carState.driftScore
                };
                saveLeaderboards();
            }

            // Update leaderboard if better than slowest
            const lb = State.leaderboards[State.trackIndex];
            if (lb && State.mode === 'time-attack') {
                // Check against AI times
                const aiTimes = [lb.times[0], lb.times[1], lb.times[2], lb.times[3]];
                // If player beats any AI, adjust? We'll leave AI fixed for now.
            }

            // Show results
            const medal = getMedal(time, State.trackIndex);
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = `
                <div style="font-size: 36px; color: #00ffff;">${TRACKS[State.trackIndex].name}</div>
                <div style="font-size: 28px;">Time: ${formatTime(currentTime)}</div>
                <div style="font-size: 22px; color: #ffaa00;">Drift Score: ${Math.floor(carState.driftScore)}</div>
                <div style="font-size: 28px; margin-top: 10px;">${medal}</div>
                ${isNewPB ? '<div style="color: #00ff88; font-size: 20px;">★ New Personal Best! ★</div>' : ''}
            `;

            hud.style.display = 'none';
            progressBar.style.display = 'none';
            splitDelta.style.display = 'none';
            respawnHint.style.display = 'none';
            resultsMenu.classList.remove('hidden');
            ghostModel.visible = false;
        }

        function getMedal(time, trackIndex) {
            const lb = State.leaderboards[trackIndex];
            if (!lb) return '';
            const t = time;
            if (t <= lb.times[3]) return '<span class="medal-author">🏆 AUTHOR MEDAL</span>';
            if (t <= lb.times[2]) return '<span class="medal-gold">🥇 GOLD MEDAL</span>';
            if (t <= lb.times[1]) return '<span class="medal-silver">🥈 SILVER MEDAL</span>';
            if (t <= lb.times[0]) return '<span class="medal-bronze">🥉 BRONZE MEDAL</span>';
            return '<span style="color: #888;">No medal</span>';
        }

        function formatTime(ms) {
            const totalSeconds = ms / 1000;
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = Math.floor(totalSeconds % 60);
            const millis = Math.floor((totalSeconds % 1) * 1000);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${millis.toString().padStart(3, '0')}`;
        }

        function respawnCar() {
            if (State.screen !== 'racing' || carState.finished) return;
            carState.position.copy(carState.lastCheckpointPos);
            carState.velocity.set(0, 0, 0);
            carState.rotation = carState.lastCheckpointRot;
            carState.airPitch = 0;
            carState.airRoll = 0;
            carState.isGrounded = true;
            carState.driftScore = 0;
            carState.driftMultiplier = 1;
            carModel.position.copy(carState.position);
            carModel.rotation.y = carState.rotation;
            playCheckpointChime();
        }

        function restartRace() {
            if (State.screen !== 'racing') return;
            startRace(State.trackIndex, State.mode);
        }

        // ============================================================
        // PHYSICS UPDATE
        // ============================================================
        const PHYSICS = {
            maxSpeed: 55, // units per second
            maxReverseSpeed: 15,
            engineForce: 45,
            brakeForce: 60,
            drag: 0.4,
            rollingResistance: 0.8,
            grip: 0.85,
            driftGrip: 0.45,
            turnSpeed: 2.8,
            driftTurnSpeed: 4.0,
            gravity: 30,
            boostForce: 80,
            boostDuration: 1.2,
            rampLaunchForce: 18
        };

        function updatePhysics(dt) {
            if (!carModel || State.screen !== 'racing') return;

            // Convert dt to seconds
            const delta = Math.min(dt, 0.05);

            // --- Steering / Throttle ---
            let throttle = 0;
            let steerInput = 0;
            if (keys['w'] || keys['arrowup']) throttle = 1;
            if (keys['s'] || keys['arrowdown']) throttle = -1;
            if (keys['a'] || keys['arrowleft']) steerInput = -1;
            if (keys['d'] || keys['arrowright']) steerInput = 1;

            // Handbrake / Drift
            const handbrake = keys[' '] || keys['space'];
            const isDriftSetup = State.carConfig.handling === 'drift';

            // Get forward vector from rotation
            const forward = new THREE.Vector3(-Math.sin(carState.rotation), 0, -Math.cos(carState.rotation));
            const right = new THREE.Vector3(Math.cos(carState.rotation), 0, -Math.sin(carState.rotation));

            // Current speed (project velocity onto forward)
            const forwardSpeed = carState.velocity.dot(forward);
            const lateralSpeed = carState.velocity.dot(right);

            // --- Engine force ---
            let engineForce = 0;
            if (throttle > 0) {
                const speedFactor = 1 - Math.min(Math.abs(forwardSpeed) / PHYSICS.maxSpeed, 1);
                engineForce = PHYSICS.engineForce * throttle * speedFactor;
            } else if (throttle < 0) {
                if (forwardSpeed > 0.5) {
                    engineForce = -PHYSICS.brakeForce; // Braking
                } else {
                    engineForce = PHYSICS.engineForce * throttle * 0.5; // Reverse
                }
            }

            // Boost
            if (carState.boostTimer > 0) {
                carState.boostTimer -= delta;
                engineForce += PHYSICS.boostForce;
            }

            // Apply engine force along forward
            if (Math.abs(forwardSpeed) < PHYSICS.maxSpeed || throttle < 0) {
                carState.velocity.add(forward.clone().multiplyScalar(engineForce * delta));
            }

            // --- Drift / Grip handling ---
            const currentGrip = handbrake ? PHYSICS.driftGrip : (isDriftSetup ? PHYSICS.grip * 0.9 : PHYSICS.grip);
            const turnSpeed = handbrake ? PHYSICS.driftTurnSpeed : (isDriftSetup ? PHYSICS.turnSpeed * 1.1 : PHYSICS.turnSpeed);

            // Kill lateral velocity based on grip
            carState.velocity.add(right.clone().multiplyScalar(-lateralSpeed * currentGrip * delta * 5));

            // Steering - rotate car based on speed
            const speedForTurn = Math.min(Math.abs(forwardSpeed) / 10, 1);
            if (Math.abs(steerInput) > 0 && Math.abs(forwardSpeed) > 0.5) {
                const turnAmount = steerInput * turnSpeed * speedForTurn * delta;
                carState.rotation += turnAmount;
                // Drift angle: if handbrake or drift setup, add lateral velocity
                if (handbrake || isDriftSetup) {
                    carState.velocity.add(right.clone().multiplyScalar(steerInput * Math.abs(forwardSpeed) * 0.15 * delta * 10));
                }
            }

            // --- Drag / Rolling resistance ---
            carState.velocity.multiplyScalar(1 - PHYSICS.drag * delta);
            if (Math.abs(forwardSpeed) > 0.1) {
                carState.velocity.add(forward.clone().multiplyScalar(-Math.sign(forwardSpeed) * PHYSICS.rollingResistance * delta));
            }

            // --- Gravity & Ground ---
            carState.velocity.y -= PHYSICS.gravity * delta;

            // --- Collision detection & ground height ---
            let groundY = 0;
            let onGround = false;
            let onRamp = false;
            let rampNormal = new THREE.Vector3(0, 1, 0);

            // Check against track colliders (AABB)
            const carPos = carState.position.clone();
            const carSize = new THREE.Vector3(2.5, 1.5, 5.0);
            const carHalf = carSize.clone().multiplyScalar(0.5);

            // Find highest ground surface below car
            for (const col of currentTrack.colliders) {
                if (col.type === 'box') {
                    // AABB check with rotation (simplified: use bounding sphere for rotated boxes)
                    const dx = carPos.x - col.position.x;
                    const dz = carPos.z - col.position.z;
                    const dist2D = Math.sqrt(dx * dx + dz * dz);
                    const colRadius = Math.max(col.size.x, col.size.z) * 0.7;
                    if (dist2D < colRadius + carHalf.x) {
                        // Check Y overlap
                        const boxTop = col.position.y + col.size.y / 2;
                        const boxBottom = col.position.y - col.size.y / 2;
                        if (carPos.y - carHalf.y < boxTop && carPos.y + carHalf.y > boxBottom) {
                            // Collision - push out
                            const pushX = dx > 0 ? 1 : -1;
                            const pushZ = dz > 0 ? 1 : -1;
                            if (Math.abs(dx) > Math.abs(dz)) {
                                carState.position.x += pushX * (carHalf.x + col.size.x / 2 - Math.abs(dx)) * 0.5;
                                carState.velocity.x *= 0.3;
                            } else {
                                carState.position.z += pushZ * (carHalf.z + col.size.z / 2 - Math.abs(dz)) * 0.5;
                                carState.velocity.z *= 0.3;
                            }
                            // Kill velocity
                            carState.velocity.multiplyScalar(0.5);
                        }
                        // Ground height
                        if (boxTop > groundY && boxTop < carPos.y + 1) {
                            groundY = Math.max(groundY, boxTop);
                        }
                    }
                } else if (col.type === 'ramp') {
                    // Ramp: check if car is above it
                    const dx = carPos.x - col.position.x;
                    const dz = carPos.z - col.position.z;
                    const dist2D = Math.sqrt(dx * dx + dz * dz);
                    const colRadius = Math.max(col.size.x, col.size.z) * 0.7;
                    if (dist2D < colRadius + carHalf.x) {
                        // Approximate ramp surface height
                        const rampHeight = col.position.y + Math.sin(col.tilt) * col.size.z / 2;
                        if (carPos.y - carHalf.y < rampHeight + 2) {
                            groundY = Math.max(groundY, rampHeight);
                            onRamp = true;
                            // Ramp gives upward velocity
                            if (carState.velocity.y < 2) {
                                carState.velocity.y += PHYSICS.rampLaunchForce * delta * 2;
                            }
                        }
                    }
                }
            }

            // Boost pads
            for (const bp of currentTrack.boostPads) {
                const dx = carPos.x - bp.position.x;
                const dz = carPos.z - bp.position.z;
                const dist2D = Math.sqrt(dx * dx + dz * dz);
                if (dist2D < Math.max(bp.size.x, bp.size.z) * 0.7) {
                    carState.boostTimer = PHYSICS.boostDuration;
                    // Boost forward
                    carState.velocity.add(forward.clone().multiplyScalar(15));
                }
            }

            // Checkpoints
            for (const cp of currentTrack.checkpoints) {
                const dx = carPos.x - cp.position.x;
                const dz = carPos.z - cp.position.z;
                const dist2D = Math.sqrt(dx * dx + dz * dz);
                if (dist2D < cp.radius && carState.checkpointIndex === cp.index) {
                    carState.checkpointIndex = cp.index + 1;
                    carState.lastCheckpointPos.copy(carPos);
                    carState.lastCheckpointRot = carState.rotation;
                    playCheckpointChime();
                    // Bank drift score
                    if (carState.driftScore > 0) {
                        carState.driftScore *= 1;
                    }
                }
            }

            // Finish gate
            if (currentTrack.finishGate) {
                const dx = carPos.x - currentTrack.finishGate.position.x;
                const dz = carPos.z - currentTrack.finishGate.position.z;
                const dist2D = Math.sqrt(dx * dx + dz * dz);
                if (dist2D < currentTrack.finishGate.radius && carState.checkpointIndex >= currentTrack.checkpoints.length) {
                    if (!carState.finished) {
                        finishRace();
                    }
                }
            }

            // Apply ground
            if (groundY > 0 && carPos.y - carHalf.y < groundY + 0.5) {
                if (carState.velocity.y < 0) {
                    carState.velocity.y = 0;
                }
                carState.position.y = Math.max(carState.position.y, groundY + carHalf.y);
                carState.isGrounded = true;
                onGround = true;
                // Air control reset
                carState.airPitch *= 0.8;
                carState.airRoll *= 0.8;
            } else {
                carState.isGrounded = false;
            }

            // Air control
            if (!carState.isGrounded) {
                if (keys['w']) carState.airPitch -= 0.5 * delta;
                if (keys['s']) carState.airPitch += 0.5 * delta;
                if (keys['a']) carState.airRoll += 0.5 * delta;
                if (keys['d']) carState.airRoll -= 0.5 * delta;
                carState.rotation += carState.airRoll * delta * 0.5;
            }

            // --- Apply velocity to position ---
            carState.position.x += carState.velocity.x * delta;
            carState.position.y += carState.velocity.y * delta;
            carState.position.z += carState.velocity.z * delta;

            // Clamp position to track bounds (fall off if too low)
            if (carState.position.y < -20) {
                respawnCar();
            }

            // --- Update car model ---
            carModel.position.copy(carState.position);
            carModel.rotation.y = carState.rotation;
            carModel.rotation.x = carState.airPitch * 0.3;
            carModel.rotation.z = carState.airRoll * 0.3;

            // --- Drift scoring ---
            const driftAngle = Math.abs(Math.atan2(lateralSpeed, Math.abs(forwardSpeed) + 0.1));
            const isDriftingNow = (handbrake || isDriftSetup) && Math.abs(forwardSpeed) > 5 && driftAngle > 0.15;

            if (isDriftingNow) {
                if (!carState.driftActive) {
                    carState.driftActive = true;
                    carState.driftMultiplier = 1;
                }
                carState.driftMultiplier = Math.min(carState.driftMultiplier + delta * 0.8, 5.0);
                carState.driftScore += Math.abs(forwardSpeed) * driftAngle * carState.driftMultiplier * delta * 10;
            } else {
                if (carState.driftActive && carState.driftMultiplier > 1) {
                    // Bank score
                    carState.driftMultiplier = 1;
                }
                carState.driftActive = false;
                carState.driftMultiplier = Math.max(1, carState.driftMultiplier - delta * 2);
            }

            // --- Update audio ---
            const speedKmh = Math.abs(forwardSpeed) * 3.6;
            const rpm = Math.min(Math.abs(forwardSpeed) / PHYSICS.maxSpeed, 1);
            updateAudio(speedKmh, rpm, carState.driftActive, carState.boostTimer > 0);

            // --- Update HUD ---
            speedEl.innerHTML = `${Math.floor(speedKmh)} <span>KM/H</span>`;
            const gear = forwardSpeed > 0 ? Math.min(6, Math.floor(forwardSpeed / 10) + 1) : (forwardSpeed < -1 ? 'R' : 'N');
            gearEl.textContent = gear;
            timerEl.textContent = formatTime(currentTime);
            driftScoreEl.textContent = `DRIFT: ${Math.floor(carState.driftScore)}`;
            driftMultEl.textContent = `x${carState.driftMultiplier.toFixed(1)}`;

            // Progress bar
            const totalCheckpoints = currentTrack.checkpoints.length + 1; // +1 for finish
            const progress = Math.min(carState.checkpointIndex / totalCheckpoints * 100, 100);
            progressFill.style.width = `${progress}%`;

            // Split delta
            if (State.personalBests[`track_${State.trackIndex}`] && State.personalBests[`track_${State.trackIndex}`][State.mode]) {
                const pbTime = State.personalBests[`track_${State.trackIndex}`][State.mode].time * 1000;
                const delta = currentTime - pbTime;
                const sign = delta >= 0 ? '+' : '-';
                const colorClass = delta >= 0 ? 'delta-negative' : 'delta-positive';
                splitDelta.innerHTML = `<span class="${colorClass}">${sign}${formatTime(Math.abs(delta))}</span>`;
            } else {
                splitDelta.innerHTML = '<span style="color: #666;">No PB</span>';
            }

            // --- Ghost car ---
            if (carState.ghostFrames.length > 0 && ghostModel) {
                const frameIndex = Math.min(Math.floor(currentTime / 16.67), carState.ghostFrames.length - 1);
                const frame = carState.ghostFrames[frameIndex];
                if (frame) {
                    ghostModel.position.set(frame.x, frame.y, frame.z);
                    ghostModel.rotation.y = frame.rot;
                    ghostModel.visible = true;
                }
            }

            // --- Particles (tire smoke) ---
            if (carState.driftActive && Math.random() < 0.6) {
                spawnTireSmoke();
            }
            updateParticles(delta);

            // --- Camera follow ---
            const camTarget = carState.position.clone();
            const camOffset = new THREE.Vector3(
                Math.sin(carState.rotation) * 12,
                6 + Math.abs(forwardSpeed) * 0.05,
                Math.cos(carState.rotation) * 12
            );
            const desiredCamPos = camTarget.clone().add(camOffset);
            camera.position.lerp(desiredCamPos, 0.08);
            camera.lookAt(camTarget.clone().add(new THREE.Vector3(0, 1, 0)));

            // Dynamic FOV
            const targetFov = 75 + Math.min(speedKmh / 10, 20) + (carState.boostTimer > 0 ? 10 : 0);
            camera.fov += (targetFov - camera.fov) * 0.05;
            camera.updateProjectionMatrix();

            // --- Record ghost frame ---
            if (State.screen === 'racing' && !carState.finished) {
                carState.ghostFrames.push({
                    x: carState.position.x,
                    y: carState.position.y,
                    z: carState.position.z,
                    rot: carState.rotation
                });
                // Cap ghost frames
                if (carState.ghostFrames.length > 20000) carState.ghostFrames.shift();
            }
        }

        function spawnTireSmoke() {
            const smokeColor = new THREE.Color(State.carConfig.smokeColor);
            const geo = new THREE.SphereGeometry(0.3 + Math.random() * 0.3, 6, 6);
            const mat = new THREE.MeshStandardMaterial({
                color: smokeColor,
                emissive: smokeColor,
                emissiveIntensity: 0.8,
                transparent: true,
                opacity: 0.7
            });
            const mesh = new THREE.Mesh(geo, mat);
            // Spawn behind car
            const backOffset = new THREE.Vector3(
                -Math.sin(carState.rotation) * 2.5,
                0.5,
                -Math.cos(carState.rotation) * 2.5
            );
            mesh.position.copy(carState.position).add(backOffset);
            mesh.position.x += (Math.random() - 0.5) * 1.5;
            mesh.position.z += (Math.random() - 0.5) * 1.5;
            scene.add(mesh);
            particles.push({
                mesh: mesh,
                life: 0.8,
                maxLife: 0.8,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 2,
                    1 + Math.random() * 2,
                    (Math.random() - 0.5) * 2
                )
            });
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                    continue;
                }
                const alpha = p.life / p.maxLife;
                p.mesh.material.opacity = alpha * 0.7;
                p.mesh.scale.setScalar(1 + (1 - alpha) * 2);
                p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
                p.velocity.y -= 2 * dt;
            }
        }

        // ============================================================
        // MENU / UI LOGIC
        // ============================================================
        function updateLeaderboardDisplay(trackIndex) {
            const lb = State.leaderboards[trackIndex];
            if (!lb) return;
            const content = document.getElementById('leaderboard-content');
            const trackName = TRACKS[trackIndex].name;
            const medals = ['Bronze', 'Silver', 'Gold', 'Author'];
            const classes = ['medal-bronze', 'medal-silver', 'medal-gold', 'medal-author'];
            let html = '';
            for (let i = 0; i < 4; i++) {
                html += `<div class="leaderboard-entry">
                    <span class="${classes[i]}">${medals[i]}</span>
                    <span>${formatTime(lb.times[i] * 1000)}</span>
                </div>`;
            }
            // Add personal best
            const pbKey = `track_${trackIndex}`;
            if (State.personalBests[pbKey] && State.personalBests[pbKey]['time-attack']) {
                const pbTime = State.personalBests[pbKey]['time-attack'].time;
                html += `<div class="leaderboard-entry" style="border-top: 2px solid #00ffff; margin-top: 5px; padding-top: 8px;">
                    <span class="medal-player">YOUR PB</span>
                    <span style="color: #00ffff;">${formatTime(pbTime * 1000)}</span>
                </div>`;
            }
            content.innerHTML = html;
        }

        // Main menu buttons
        document.querySelectorAll('#main-menu .btn[data-track]').forEach(btn => {
            btn.addEventListener('click', () => {
                const trackIndex = parseInt(btn.dataset.track);
                updateLeaderboardDisplay(trackIndex);
                // Show leaderboard for selected track
                document.querySelector('#menu-leaderboard h3').textContent = `🏆 ${TRACKS[trackIndex].name}`;
                // Start race
                startRace(trackIndex, 'time-attack');
            });
        });

        // Garage button
        document.getElementById('garage-btn').addEventListener('click', () => {
            mainMenu.classList.add('hidden');
            garageMenu.classList.remove('hidden');
            State.screen = 'garage';
        });

        // Garage back
        document.getElementById('garage-back').addEventListener('click', () => {
            garageMenu.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            State.screen = 'menu';
            saveCarConfig();
        });

        // Garage color swatches
        const primaryColors = ['#00aaff', '#ff0066', '#ffaa00', '#00ff88', '#aa00ff', '#ff4400', '#ffffff'];
        const secondaryColors = ['#ffffff', '#000000', '#aaaaaa', '#ff00ff', '#00ffff', '#ffff00', '#ff6600'];
        const rimColors = ['#ffaa00', '#ffffff', '#000000', '#00ffff', '#ff00ff', '#00ff00', '#ff0000'];
        const underglowColors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff0000', '#ffffff', '#ff6600'];
        const smokeColors = ['#ff00ff', '#00ffff', '#ffff00', '#ffffff', '#ff4400', '#00ff88', '#aa00ff'];

        function createSwatches(containerId, colors, configKey) {
            const container = document.getElementById(containerId);
            colors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color;
                swatch.style.color = color;
                if (State.carConfig[configKey] === color) swatch.classList.add('selected');
                swatch.addEventListener('click', () => {
                    State.carConfig[configKey] = color;
                    container.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                    swatch.classList.add('selected');
                    // Update car model in real-time if in garage
                    if (carModel) {
                        scene.remove(carModel);
                        carModel = createCarModel(State.carConfig);
                        carModel.position.copy(carState.position);
                        carModel.rotation.y = carState.rotation;
                        scene.add(carModel);
                    }
                    saveCarConfig();
                });
                container.appendChild(swatch);
            });
        }

        createSwatches('primary-swatches', primaryColors, 'primaryColor');
        createSwatches('secondary-swatches', secondaryColors, 'secondaryColor');
        createSwatches('rim-swatches', rimColors, 'rimColor');
        createSwatches('underglow-swatches', underglowColors, 'underglow');
        createSwatches('smoke-swatches', smokeColors, 'smokeColor');

        // Body style buttons
        document.getElementById('body-super').addEventListener('click', () => {
            State.carConfig.bodyStyle = 'super';
            saveCarConfig();
            if (carModel) {
                scene.remove(carModel);
                carModel = createCarModel(State.carConfig);
                carModel.position.copy(carState.position);
                carModel.rotation.y = carState.rotation;
                scene.add(carModel);
            }
        });
        document.getElementById('body-coupe').addEventListener('click', () => {
            State.carConfig.bodyStyle = 'coupe';
            saveCarConfig();
            if (carModel) {
                scene.remove(carModel);
                carModel = createCarModel(State.carConfig);
                carModel.position.copy(carState.position);
                carModel.rotation.y = carState.rotation;
                scene.add(carModel);
            }
        });
        document.getElementById('body-formula').addEventListener('click', () => {
            State.carConfig.bodyStyle = 'formula';
            saveCarConfig();
            if (carModel) {
                scene.remove(carModel);
                carModel = createCarModel(State.carConfig);
                carModel.position.copy(carState.position);
                carModel.rotation.y = carState.rotation;
                scene.add(carModel);
            }
        });

        // Handling
        document.getElementById('handling-grip').addEventListener('click', () => {
            State.carConfig.handling = 'grip';
            saveCarConfig();
        });
        document.getElementById('handling-drift').addEventListener('click', () => {
            State.carConfig.handling = 'drift';
            saveCarConfig();
        });

        // Results buttons
        document.getElementById('results-retry').addEventListener('click', () => {
            resultsMenu.classList.add('hidden');
            startRace(State.trackIndex, State.mode);
        });
        document.getElementById('results-menu-btn').addEventListener('click', () => {
            resultsMenu.classList.add('hidden');
            mainMenu.classList.remove('hidden');
            State.screen = 'menu';
            hud.style.display = 'none';
            progressBar.style.display = 'none';
            splitDelta.style.display = 'none';
            respawnHint.style.display = 'none';
        });

        // ============================================================
        // MAIN LOOP
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min((now - lastFrameTime) / 1000, 0.05);
            lastFrameTime = now;

            if (State.screen === 'racing') {
                currentTime = now - raceStartTime;
                updatePhysics(dt);
            } else if (State.screen === 'garage') {
                // Rotating turntable for garage
                if (carModel) {
                    carModel.rotation.y += dt * 0.5;
                    camera.position.set(8, 4, 8);
                    camera.lookAt(carModel.position);
                }
            }

            renderer.render(scene, camera);
        }

        // Initialize menu leaderboard
        updateLeaderboardDisplay(0);

        // Set up a dummy track for menu background
        (function initMenuBackground() {
            const tb = new TrackBuilder();
            TRACKS[0].build(tb);
            scene.add(tb.group);
            currentTrack = tb;
            carModel = createCarModel(State.carConfig);
            carModel.position.set(0, 2, -180);
            carModel.rotation.y = 0;
            scene.add(carModel);
            camera.position.set(0, 15, -150);
            camera.lookAt(0, 2, -180);
        })();

        animate();
    </script>
</body>
</html>
