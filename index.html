<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Steal the Pets 3D 🐾</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1220;
  font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;user-select:none;color:#fff}
canvas{display:block;position:absolute;inset:0;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#ui > *{pointer-events:none}

.hud{position:absolute;background:linear-gradient(180deg,rgba(20,28,45,.94),rgba(12,18,32,.94));
  border:2px solid rgba(120,180,255,.25);border-radius:16px;padding:10px 14px;
  box-shadow:0 8px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(6px)}
#hudTL{top:12px;left:12px;min-width:210px}
#hudTR{top:12px;right:12px;min-width:190px}
.money{font-size:26px;font-weight:bold;color:#ffd75e;text-shadow:0 2px 0 #8a6a00,0 0 18px rgba(255,200,60,.5);line-height:1.1}
.income{font-size:13px;color:#7dffb0;font-weight:bold;margin-top:2px}
.lvlrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:bold;color:#9fb6d8}
.xpbar{flex:1;height:9px;background:#0a1220;border-radius:6px;overflow:hidden;border:1px solid rgba(120,180,255,.2)}
.xpfill{height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#a855f7);border-radius:6px;transition:width .25s ease}
.trow{display:flex;justify-content:space-between;font-size:12.5px;font-weight:bold;color:#cfe0f5;padding:2.5px 0}
.trow b{color:#fff}
#hudTR .trow span:first-child{color:#93a9c9}

#dock{position:absolute;bottom:12px;right:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#dock button{pointer-events:auto;font-family:inherit;font-size:13px;font-weight:bold;color:#eaf2ff;
  background:linear-gradient(180deg,#2b3d5e,#1a2740);border:2px solid rgba(120,180,255,.3);
  border-radius:12px;padding:9px 14px;cursor:pointer;min-width:118px;text-align:left;
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s,filter .12s}
#dock button:hover{filter:brightness(1.22)}
#dock button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}

#prompt{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);
  background:rgba(10,16,28,.92);border:2px solid #ffd75e;border-radius:12px;
  padding:9px 18px;font-size:14px;font-weight:bold;color:#ffd75e;display:none;
  box-shadow:0 0 22px rgba(255,215,94,.35);white-space:nowrap}

#toasts{position:absolute;top:96px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:7px;align-items:center;width:min(94vw,560px);z-index:12}
.toast{background:rgba(14,22,38,.95);border-left:4px solid #38bdf8;border-radius:10px;
  padding:9px 16px;font-size:13.5px;font-weight:bold;color:#dbe9ff;
  box-shadow:0 6px 22px rgba(0,0,0,.5);animation:toastIn .28s ease;max-width:100%}
.toast.good{border-left-color:#4ade80;color:#c6ffdd}
.toast.bad{border-left-color:#f43f5e;color:#ffd0d8}
.toast.epic{border-left-color:#a855f7;color:#edd6ff;box-shadow:0 6px 26px rgba(168,85,247,.5)}
.toast.gold{border-left-color:#ffd75e;color:#fff3c4;box-shadow:0 6px 26px rgba(255,215,94,.45)}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.94)}to{opacity:1;transform:none}}

#floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:11}
.floater{position:absolute;left:0;top:0;font:bold 18px "Trebuchet MS",sans-serif;
  text-shadow:0 2px 8px #000,0 0 12px currentColor;pointer-events:none;white-space:nowrap;
  will-change:transform,opacity}

#stealBar{position:absolute;left:0;top:0;width:86px;height:12px;background:rgba(0,0,0,.8);
  border:2px solid #ffd75e;border-radius:7px;pointer-events:none;display:none;z-index:12;
  transform:translate(-50%,-50%);box-shadow:0 0 14px rgba(255,215,94,.7)}
#stealBarFill{height:100%;width:0%;background:linear-gradient(90deg,#ffe27a,#ffa020);border-radius:4px;transition:width .05s}

#panel{position:absolute;inset:0;background:rgba(4,8,16,.78);display:none;
  align-items:center;justify-content:center;pointer-events:auto;backdrop-filter:blur(4px);z-index:20;padding:12px}
#panel.open{display:flex}
.sheet{width:min(96vw,760px);max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#141d30,#0c1422);border:2px solid rgba(120,180,255,.3);
  border-radius:20px;box-shadow:0 22px 70px rgba(0,0,0,.7);overflow:hidden;animation:sheetIn .22s ease}
@keyframes sheetIn{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:2px solid rgba(120,180,255,.16);
  background:linear-gradient(180deg,rgba(56,189,248,.12),transparent)}
.sheet header h2{font-size:19px;letter-spacing:.5px;color:#eaf4ff}
.sheet header button{pointer-events:auto;font-family:inherit;font-size:16px;font-weight:bold;
  color:#ff8fa3;background:rgba(244,63,94,.14);border:2px solid rgba(244,63,94,.4);
  border-radius:10px;width:38px;height:34px;cursor:pointer}
.sheet header button:hover{background:rgba(244,63,94,.3)}
#panelBody{padding:16px;overflow-y:auto;overscroll-behavior:contain}
#panelBody::-webkit-scrollbar{width:9px}
#panelBody::-webkit-scrollbar-thumb{background:rgba(120,180,255,.35);border-radius:6px}

.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.card{background:linear-gradient(180deg,#1b2740,#131d2e);border:2px solid rgba(120,180,255,.2);
  border-radius:14px;padding:12px;transition:border-color .15s}
.card:hover{border-color:rgba(120,180,255,.45)}
.card .ct{font-size:14.5px;font-weight:bold;color:#eaf4ff;display:flex;align-items:center;gap:7px}
.card .cd{font-size:11.5px;color:#8ba4c7;margin-top:5px;line-height:1.4;min-height:30px}
.btnrow{margin-top:10px}
.btn{pointer-events:auto;width:100%;font-family:inherit;font-size:13px;font-weight:bold;color:#06121f;
  background:linear-gradient(180deg,#7dffb0,#33cc7a);border:none;border-radius:10px;
  padding:9px;cursor:pointer;box-shadow:0 3px 0 #1c7a45;transition:transform .08s,filter .12s}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1c7a45}
.btn:disabled{background:linear-gradient(180deg,#3a4560,#2a3348);color:#6d7d99;
  box-shadow:0 3px 0 #1a2030;cursor:not-allowed;filter:none}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#e8b93a);box-shadow:0 3px 0 #8a6a00;color:#231a00}
.btn.purple{background:linear-gradient(180deg,#c78bff,#9b51e0);box-shadow:0 3px 0 #5c2a8f;color:#fff}
.btn.blue{background:linear-gradient(180deg,#7dd3fc,#38bdf8);box-shadow:0 3px 0 #0b6f9e;color:#04121c}
.btn.red{background:linear-gradient(180deg,#ff8fa3,#e63757);box-shadow:0 3px 0 #8c1f33;color:#fff}

.petgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.petcell{background:rgba(255,255,255,.045);border:2px solid rgba(120,180,255,.16);
  border-radius:12px;padding:8px 4px;text-align:center}
.petcell .pe{font-size:27px;line-height:1.1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.petcell .pn{font-size:10px;font-weight:bold;color:#cfe0f5;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.petcell .pi{font-size:10px;color:#7dffb0;font-weight:bold}
.petcell .pr{font-size:9px;font-weight:bold;letter-spacing:.5px}

.lbrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;
  background:rgba(255,255,255,.04);margin-bottom:6px;font-size:13px;font-weight:bold}
.lbrow.me{background:rgba(56,189,248,.16);border:1px solid rgba(56,189,248,.4)}
.lbrank{width:26px;color:#8ba4c7}
.lbname{flex:1;color:#eaf4ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbval{color:#ffd75e}

#joy{position:absolute;left:22px;bottom:22px;width:132px;height:132px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,180,255,.14),rgba(120,180,255,.05));
  border:2px solid rgba(120,180,255,.3);pointer-events:auto;display:none;touch-action:none;z-index:99}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fd0ff,#3b7fc4);
  box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* Action Buttons (Bottom Right, shifted left so dock is visible) */
#actionBtns{position:absolute;right:150px;bottom:22px;display:flex;flex-direction:column;gap:12px;z-index:99}
#actionBtns button{width:86px;height:86px;border-radius:50%;border:3px solid #fff;
  font-family:inherit;font-weight:bold;font-size:14px;touch-action:none;
  box-shadow:0 6px 20px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;text-align:center}
#actionBtns button:active{transform:scale(.92)}

#stealBtn{background:radial-gradient(circle at 35% 30%,#ffe27a,#e8a03a);border-color:#fff3c4;color:#231a00;display:none}
#shieldBtn{background:radial-gradient(circle at 35% 30%,#7dd3fc,#0ea5e9);border-color:#bae6fd;color:#04121c}

.race{margin:10px 0}
.raceTrack{height:26px;background:#0a1220;border-radius:9px;position:relative;overflow:hidden;
  border:2px solid rgba(120,180,255,.2);margin-bottom:8px}
.raceFill{height:100%;width:0%;border-radius:7px;transition:width .1s linear;
  background:linear-gradient(90deg,#38bdf8,#7dffb0)}
.raceFill.rival{background:linear-gradient(90deg,#f43f5e,#ff9a6c)}
.raceLabel{position:absolute;left:10px;top:4px;font-size:12px;font-weight:bold;color:#04121c}
.bigpet{font-size:78px;text-align:center;line-height:1;filter:drop-shadow(0 8px 22px rgba(0,0,0,.7));animation:pop .45s cubic-bezier(.2,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.shake{animation:shk .35s infinite}
@keyframes shk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.hidden{display:none!important}
.center{text-align:center}
.dim{color:#8ba4c7;font-size:12.5px;line-height:1.55}
h3.sec{font-size:14px;color:#9fb6d8;margin:16px 0 8px;letter-spacing:1px;text-transform:uppercase}
h3.sec:first-child{margin-top:0}
#loadErr{position:fixed;inset:0;background:#0b1220;color:#fff;display:none;align-items:center;
  justify-content:center;padding:40px;text-align:center;font-family:sans-serif;font-size:16px;line-height:1.6;z-index:9999}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="ui">
  <div id="floaters"></div>
  <div id="stealBar"><div id="stealBarFill"></div></div>

  <div class="hud" id="hudTL">
    <div class="money">💰 <span id="uiMoney">0</span></div>
    <div class="income">📈 <span id="uiIncome">0</span>/sec</div>
    <div class="lvlrow"><span>LV <b id="uiLevel">1</b></span>
      <div class="xpbar"><div class="xpfill" id="uiXP"></div></div></div>
  </div>

  <div class="hud" id="hudTR">
    <div class="trow"><span>👟 Speed</span><b id="uiSpeed">Lv 1</b></div>
    <div class="trow"><span>💪 Strength</span><b id="uiStr">Lv 1</b></div>
    <div class="trow"><span>🐾 Pets</span><b id="uiPets">0 / 6</b></div>
    <div class="trow"><span>🌍 World</span><b id="uiWorld">1 · W1</b></div>
    <div class="trow"><span>♻️ Rebirths</span><b id="uiReb">0</b></div>
  </div>

  <div id="prompt"></div>
  <div id="toasts"></div>

  <div id="dock">
    <button data-panel="shop">🛒 Upgrade Shop</button>
    <button data-panel="eggs">🥚 Egg Shop</button>
    <button data-panel="pets">🐾 My Pets</button>
    <button data-panel="waves">🌍 Challenges</button>
    <button data-panel="board">🏆 Leaderboard</button>
    <button data-panel="rebirth">♻️ Rebirth</button>
  </div>

  <div id="joy"><div id="joyKnob"></div></div>

  <div id="actionBtns">
    <button id="shieldBtn">🛡️<br>Shield</button>
    <button id="stealBtn">STEAL</button>
  </div>

  <div id="panel">
    <div class="sheet">
      <header><h2 id="panelTitle">Shop</h2><button id="panelClose">✕</button></header>
      <div id="panelBody"></div>
    </div>
  </div>
</div>

<div id="loadErr">⚠️ <b>Failed to load Three.js</b><br><br>
The game needs an internet connection to fetch the 3D engine.<br>
Please check your connection and refresh.</div>

<script>
setTimeout(() => {
  if (!window.__gameStarted) document.getElementById('loadErr').style.display = 'flex';
}, 6000);
</script>

/* ==================================================================

renderer.setSize(window.innerWidth, window.innerHeight);

/* ---- sky gradient ---- */
(function buildSky() {
  const skyGeo = new THREE.SphereGeometry(280, 32, 16);
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      topColor:    { value: new THREE.Color(0x3a7bd5) },
      bottomColor: { value: new THREE.Color(0xbfe9ff) },
      offset:      { value: 30 },
      exponent:    { value: 0.75 },
    },
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPos.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorldPosition;
      void main() {
        float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0), exponent), 0.0)), 1.0);
      }
    `,
    side: THREE.BackSide,
    depthWrite: false,
  });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);
})();

const emojiTexCache = {};
function emojiTexture(emoji, size = 160) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.font = `${size * 0.78}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",serif`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(emoji, size/2, size/2 + size*0.06);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function getEmojiTex(emoji) {
  if (!emojiTexCache[emoji]) emojiTexCache[emoji] = emojiTexture(emoji);
  return emojiTexCache[emoji];
}
function rr(g,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
  g.closePath();
}
function makeLabelTexture(text, colorHex, w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.font = `bold ${Math.floor(h*0.5)}px "Trebuchet MS",sans-serif`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  const tw = g.measureText(text).width;
  const padX = 30, boxW = Math.min(w - 20, tw + padX*2), boxH = h * 0.72;
  const bx = (w - boxW)/2, by = (h - boxH)/2;
  rr(g, bx, by, boxW, boxH, 22);
  g.fillStyle = 'rgba(8,14,26,0.92)';
  g.fill();
  g.strokeStyle = colorHex;
  g.lineWidth = 5;
  g.stroke();
  g.fillStyle = colorHex;
  g.fillText(text, w/2, h/2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeBlobTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32,32,0,32,32,32);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(0.65, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0,0,64,64);
  const tex = new THREE.CanvasTexture(c);
  return tex;
}
const blobTex = makeBlobTex();

}

function makeBases() {
  for (let i = 0; i < 8; i++) {
    const ang = Math.PI/2 + i * (Math.PI*2/8);
    const bx = CX + Math.cos(ang) * RING;
    const by = CY + Math.sin(ang) * RING;
    bases.push({
      id:i, x:bx, y:by, hw:BASE_HW, hh:BASE_HH,
      name: i === 0 ? 'YOUR BASE' : BOT_NAMES[i-1],
      color: i === 0 ? '#38bdf8' : BOT_COLORS[i-1],
      isPlayer: i === 0, shieldUntil: 0, bot: null, shieldMesh: null,
    });
  }
  for (const b of bases) createBaseMesh(b);
}

function createBaseMesh(b) {
  const sx = s(b.x), sz = s(b.y);
  const w = s(b.hw*2), d = s(b.hh*2);
  const col = new THREE.Color(b.color);
  const floorColor = b.isPlayer ? 0x2a4a72 : 0x3a2a5a;

  // Floor
  const platform = new THREE.Mesh(
    new THREE.BoxGeometry(w + 1.6, 0.6, d + 1.6),
    new THREE.MeshStandardMaterial({color:0x1a2030, roughness:0.85})
  );
  platform.position.set(sx, 0.3, sz);
  scene.add(platform);

  const top = new THREE.Mesh(
    new THREE.BoxGeometry(w, 0.25, d),
    new THREE.MeshStandardMaterial({
      color: floorColor, roughness: 0.55, metalness: 0.25,
      emissive: col, emissiveIntensity: 0.08,
    })
  );
  top.position.set(sx, 0.73, sz);
  scene.add(top);

  // Walls (Back, Left, Right)
  const wallMat = new THREE.MeshStandardMaterial({color: 0x222a35, roughness:0.8});
  const wallH = 6;
  
  // Back wall
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(w, wallH, 0.5), wallMat);
  backWall.position.set(sx, wallH/2, sz - d/2);
  scene.add(backWall);

  // Left wall
  const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, wallH, d), wallMat);
  leftWall.position.set(sx - w/2, wallH/2, sz);
  scene.add(leftWall);

  // Right wall
  const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, wallH, d), wallMat);
  rightWall.position.set(sx + w/2, wallH/2, sz);
  scene.add(rightWall);

  // Neon border on top of walls
  const neonMat = new THREE.MeshBasicMaterial({color: col});
  const backNeon = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.2, 0.2), neonMat);
  backNeon.position.set(sx, wallH, sz - d/2);
  scene.add(backNeon);

  const leftNeon = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, d + 0.5), neonMat);
  leftNeon.position.set(sx - w/2, wallH, sz);
  scene.add(leftNeon);

  const rightNeon = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, d + 0.5), neonMat);
  rightNeon.position.set(sx + w/2, wallH, sz);
  scene.add(rightNeon);

  // Sign
  const labelTex = makeLabelTexture(b.name, b.color, 512, 100);
  const sign = new THREE.Sprite(new THREE.SpriteMaterial({
    map: labelTex, depthTest: true, depthWrite: false,
  }));
  sign.scale.set(7, 1.37, 1);
  sign.position.set(sx, wallH + 1.5, sz);
  scene.add(sign);

  // Shield Dome (Temporary barrier)
  const shieldR = Math.max(w, d) / 2 + 1.2;
  const shield = new THREE.Mesh(
    new THREE.CylinderGeometry(shieldR, shieldR, wallH + 2, 48, 1, true),
    new THREE.MeshBasicMaterial({
      color:0x38bdf8, transparent:true, opacity:0.25,
      side:THREE.DoubleSide, depthWrite:false,
      blending:THREE.AdditiveBlending,
    })
  );
  shield.position.set(sx, (wallH+2)/2, sz);
  shield.visible = false;
  scene.add(shield);
  b.shieldMesh = shield;
}

function baseInner(b) { return {x0:b.x-b.hw+46, x1:b.x+b.hw-46, y0:b.y-b.hh+52, y1:b.y+b.hh-46}; }
function insideBase(b,x,y,pad=0) {
  return x > b.x-b.hw-pad && x < b.x+b.hw+pad && y > b.y-b.hh-pad && y < b.y+b.hh+pad;
}

  const legR = new THREE.Mesh(legGeo, pantsMat);
  legR.position.y = -0.475;
  legRPivot.add(legR);
  body.add(legRPivot);

  const armGeo = new THREE.BoxGeometry(0.32, 1.0, 0.4);
  const armLPivot = new THREE.Group();
  armLPivot.position.set(-0.77, 1.9, 0);
  const armL = new THREE.Mesh(armGeo, sleeveMat);
  armL.position.y = -0.5;

}

function addPet(spId, baseId) {
  const p = makePet(spId, baseId);
  createPetMesh(p);
  pets.push(p);
  return p;
}

/* ==================================================================
   DERIVED
   ================================================================== */
function incomeMult() { return (1 + (S.sp.income-1)*0.30) * (1 + S.rebirths*0.35); }
function income() {
  let sum = 0;
  for (const p of pets) if (p.baseId === 0 && !p.carrier) sum += petIncome(p);
  return sum * incomeMult();
}
function capacity() { return 4 + S.sp.storage*2; }
function myPets() { return pets.filter(p => p.baseId === 0).length; }
function power() {
  return S.sp.speed*12 + S.sp.strength*12 + S.sp.storage*4 + S.sp.shield*4
       + S.sp.steal*4 + S.sp.income*4 + income()/8 + S.rebirths*120;
}
function xpNeeded(l) { return Math.floor(80*Math.pow(l,1.6)); }
function addXP(n) {
  S.xp += n;
  let guard = 0;
  while (S.xp >= xpNeeded(S.level) && guard++ < 200) {
    S.xp -= xpNeeded(S.level); S.level++;
    toast('🎉 Level up! You reached level '+S.level, 'epic');
    burst3D(player.x, 2, player.y, 22, '#a855f7');
  }
}
function upgCost(key) { return Math.floor(UPGRADES[key].base * Math.pow(UPGRADES[key].mult, S.sp[key]-1)); }
function carryMult(pet) { return clamp(1 - petWeight(pet)*(0.42 - S.sp.strength*0.05), 0.28, 1); }
function playerSpeed() {
  let sp = SPEEDS[S.sp.speed-1];
  if (player.carrying) sp *= carryMult(player.carrying);
  return sp;
}
function stealTime() { return Math.max(0.45, 1.9 - S.sp.steal*0.28); }

/* ==================================================================
   UTIL
   ================================================================== */
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(a + Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => v<a ? a : (v>b ? b : v);
const lerp = (a,b,t) => a + (b-a)*t;
const dist2 = (a,b) => { const dx=a.x-b.x, dy=a.y-b.y; return dx*dx + dy*dy; };
const dist = (a,b) => Math.sqrt(dist2(a,b));

function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 0) return '-' + fmt(-n);
  if (n < 1000) return (n < 10 ? (Math.round(n*10)/10).toString() : Math.floor(n).toString());
  const u = ['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
  let i = 0;
  while (n >= 1000 && i < u.length-1) { n /= 1000; i++; }
  return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n).toString()) + u[i];
}

/* ==================================================================
   PARTICLES
   ================================================================== */
const MAX_PARTS = 240;
const partGeo = new THREE.BufferGeometry();
const partPositions = new Float32Array(MAX_PARTS * 3);
const partColors = new Float32Array(MAX_PARTS * 3);
partGeo.setAttribute('position', new THREE.BufferAttribute(partPositions, 3));
partGeo.setAttribute('color', new THREE.BufferAttribute(partColors, 3));
const partPoints = new THREE.Points(partGeo, new THREE.PointsMaterial({
  size:0.6, vertexColors:true, transparent:true, opacity:0.95, depthWrite:false, sizeAttenuation:true,
}));
partPoints.frustumCulled = false;
scene.add(partPoints);
const parts = [];

function burst3D(gx, gy, gz, n, colorHex) {
  const col = new THREE.Color(colorHex);
  for (let i = 0; i < n && parts.length < MAX_PARTS; i++) {
    const a = Math.random()*Math.PI*2;
    const sp = 2 + Math.random()*5;
    parts.push({
      x:s(gx), y:gy, z:s(gz),
      vx:Math.cos(a)*sp, vy:2 + Math.random()*4, vz:Math.sin(a)*sp,
      life:0.5 + Math.random()*0.5, max:1,
      r:col.r, g:col.g, b:col.b,
    });
  }
}

function updateParticles(dt) {
  for (let i = parts.length-1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    p.vy -= 12*dt;
    p.vx *= 0.94; p.vz *= 0.94;
  }
  for (let i = 0; i < MAX_PARTS; i++) {
    if (i < parts.length) {
      const p = parts[i];
      partPositions[i*3]   = p.x;
      partPositions[i*3+1] = p.y;
      partPositions[i*3+2] = p.z;
      partColors[i*3]   = p.r;
      partColors[i*3+1] = p.g;
      partColors[i*3+2] = p.b;
    } else {
      partPositions[i*3+1] = -1000;
    }
  }
  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;
}

/* floating DOM text */
const floatersEl = document.getElementById('floaters');
const floaters = [];
function floatText3D(gx, gy, gz, text, color, size) {
  const el = document.createElement('div');
  el.className = 'floater';
  el.textContent = text;
  el.style.color = color || '#fff';
  el.style.fontSize = (size || 18) + 'px';
  floatersEl.appendChild(el);
  floaters.push({el, x:s(gx), y:gy || 2, z:s(gz), vy:2.2, life:1.2, max:1.2});
}
const _v = new THREE.Vector3();
function updateFloaters(dt) {
  const W = window.innerWidth, H = window.innerHeight;
  for (let i = floaters.length-1; i >= 0; i--) {
    const f = floaters[i];
    f.life -= dt;
    if (f.life <= 0) { f.el.remove(); floaters.splice(i,1); continue; }
    f.y += f.vy*dt;
    f.vy *= 0.96;
    _v.set(f.x, f.y, f.z).project(camera);
    if (_v.z > 1) { f.el.style.opacity = 0; continue; }
    const sx = (_v.x*0.5 + 0.5)*W;
    const sy = (-_v.y*0.5 + 0.5)*H;
    const a = f.life/f.max;
    f.el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-50%) scale(${0.85 + a*0.25})`;
    f.el.style.opacity = a;
  }
}

function joyPos(e) {
  const r = joy.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  let dx = t.clientX - (r.left + r.width/2);
  let dy = t.clientY - (r.top + r.height/2);
  const d = Math.hypot(dx, dy), max = r.width/2 - 14;
  if (d > max) { dx = dx/d*max; dy = dy/d*max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  joyVec.x = dx/max; joyVec.y = dy/max;
}
joy.addEventListener('pointerdown', e => { joyActive = true; joy.setPointerCapture(e.pointerId); joyPos(e); });
joy.addEventListener('pointermove', e => { if (joyActive) joyPos(e); });
joy.addEventListener('pointerup', () => { joyActive = false; joyVec.x = 0; joyVec.y = 0; knob.style.transform = ''; });

function save() {
  try {
    const data = {
      money:S.money, totalEarned:S.totalEarned, xp:S.xp, level:S.level,
      sp:{...S.sp}, collection:{...S.collection}, waves:S.waves,
      rebirths:S.rebirths, stats:{...S.stats},
      shieldUntil:bases[0].shieldUntil,
      myPets:pets.filter(p => p.baseId === 0).map(p => p.sp),
    };
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch(e) {}
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e) {}
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    S.money = d.money || 0; S.totalEarned = d.totalEarned || 0;
    S.xp = d.xp || 0; S.level = d.level || 1;
    if (d.sp) for (const k in S.sp) S.sp[k] = d.sp[k] || 1;
    S.collection = d.collection || {};
    S.waves = d.waves || 0; S.rebirths = d.rebirths || 0;
    if (d.stats) Object.assign(S.stats, d.stats);
    bases[0].shieldUntil = d.shieldUntil || 0;
    (d.myPets || []).forEach(sp => { if (PETS[sp]) addPet(sp, 0); });
    return true;
  } catch(e) { return false; }
}

/* ==================================================================
   ACTIONS
   ================================================================== */
function nearestStealable() {
  let best = null, bd = 1e18;
  for (const p of pets) {
    if (p.carrier) continue;
    if (p.baseId === 0) continue;
    if (bases[p.baseId].shieldUntil > NOW) continue;
    const d = dist2(p, player);
    if (d < 118*118 && d < bd) { bd = d; best = p; }
  }
  return best;
}

function pickUpPet(pet) {
  if (myPets() >= capacity()) { toast('📦 Your base is full! Upgrade storage.', 'bad'); return; }
  pet.carrier = player;
  player.carrying = pet;
  const owner = bases[pet.baseId];
  if (owner.bot) {
    owner.bot.state = 'chase';
    owner.bot.chaseT = 16;
    owner.bot.target = player;
  }
  floatText3D(player.x, 3.5, player.y, 'STEALING!', '#ffd75e', 20);
  burst3D(pet.x, 1.5, pet.y, 16, RARITY[petDef(pet).r].color);
  toast('🫳 You grabbed ' + petDef(pet).n + '! Get home fast!', 'gold');
  playSound(660, 0.08, 'square', 0.05);
}

function dropCarried(entity, returnHome) {
  const pet = entity.carrying;
  if (!pet) return;
  entity.carrying = null;
  pet.carrier = null;
  if (returnHome) {
    const hb = bases[pet.homeBase];
    pet.x = hb.x + rand(-120,120);
    pet.y = hb.y + rand(-90,90);
    pet.baseId = pet.homeBase;
    burst3D(pet.x, 1.5, pet.y, 18, '#f43f5e');
    floatText3D(pet.x, 3, pet.y, 'RETURNED', '#ff8fa3', 16);
  }
}

function deliverPet() {
  const pet = player.carrying;
  if (!pet) return;
  if (myPets() >= capacity()) {
    toast('📦 Base full! Pet dropped outside.', 'bad');
    dropCarried(player, true);
    return;
  }
  player.carrying = null;
  pet.carrier = null;
  pet.baseId = 0;
  pet.homeBase = 0;
  const b = bases[0];
  pet.x = b.x + rand(-180,180);
  pet.y = b.y + rand(-120,120);
  pet.tx = pet.x; pet.ty = pet.y;
  S.stats.stolen++;
  addXP(18 + Math.floor(petIncome(pet)*0.25));
  burst3D(pet.x, 1.5, pet.y, 26, RARITY[petDef(pet).r].color);
  floatText3D(pet.x, 3, pet.y, '+' + petDef(pet).n + '!', '#7dffb0', 20);
  toast('✅ You stole ' + petDef(pet).n + '! +' + fmt(petIncome(pet)) + '/s', 'good');
  const owner = bases[pet.homeBase];
  if (owner.bot) { owner.bot.state = 'idle'; owner.bot.think = rand(4,9); }
  playSound(880, 0.1, 'square', 0.05);
}

let actx = null;
function playSound(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = vol || 0.06;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (dur || 0.1));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (dur || 0.1));
  } catch(e) {}
}

/* ==================================================================
   UPDATE
   ================================================================== */
let moneyFloaterTimer = 0;

function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'])    dy -= 1;
  if (keys['s'] || keys['arrowdown'])  dy += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (joyActive) { dx += joyVec.x; dy += joyVec.y; }
  const m = Math.hypot(dx, dy);
  if (m > 0.01) { dx /= m; dy /= m; } else { dx = 0; dy = 0; }

  // Move relative to camera yaw
  const moveX = dx * Math.cos(cameraYaw) - dy * Math.sin(cameraYaw);
  const moveZ = dx * Math.sin(cameraYaw) + dy * Math.cos(cameraYaw);

  const sp = playerSpeed();
  player.x = clamp(player.x + moveX*sp*dt, 30, WORLD_W-30);
  player.y = clamp(player.y + moveZ*sp*dt, 30, WORLD_H-30);

  if (player.carrying) {
    const pet = player.carrying;
    pet.x = player.x; pet.y = player.y;
  }

  const target = nearestStealable();
  const holding = keys['e'] || keys[' '] || input.interact;

  if (target) {
    player.stealTarget = target;
    if (holding) {
      player.stealProgress += dt / stealTime();
      if (player.stealProgress >= 1) {
        player.stealProgress = 0;
        pickUpPet(target);
      }
    } else {
      player.stealProgress = Math.max(0, player.stealProgress - dt*1.4);
    }
  } else {
    player.stealTarget = null;
    player.stealProgress = 0;
  }

  if (player.carrying && insideBase(bases[0], player.x, player.y, -10)) {
    deliverPet();
  }

  const pr = document.getElementById('prompt');
  if (player.carrying) {
    pr.style.display = 'block';
    pr.innerHTML = '🏠 Carry it home! &nbsp;<span style="color:#7dffb0">Speed ' + Math.round(carryMult(player.carrying)*100) + '%</span>';
  } else if (target) {
    pr.style.display = 'block';
    pr.innerHTML = 'Hold <b>[E]</b> / STEAL to grab <b style="color:' + RARITY[petDef(target).r].color + '">' + petDef(target).n + '</b>';
  } else {
    pr.style.display = 'none';
  }
}

function updatePetsLogic(dt) {
  for (const p of pets) {
    if (p.carrier) continue;
    p.wt -= dt;
    if (p.wt <= 0) {
      const b = bases[p.baseId], inn = baseInner(b);
      p.tx = rand(inn.x0, inn.x1);
      p.ty = rand(inn.y0, inn.y1);
      p.wt = rand(1.2, 3.5);
    }
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
    if (d > 4) {
      const sp = 42;
      p.x += dx/d*sp*dt;
      p.y += dy/d*sp*dt;
    }
    p.bob += dt * 2.4;
  }
}

function moveTo(e, tx, ty, speed, dt) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d < 3) return true;
  e.x += dx/d * speed * dt;
  e.y += dy/d * speed * dt;
  return false;
}

function updateBot(b, dt) {
  if (b.stun > 0) { b.stun -= dt; return; }

  if (b.state === 'chase') {
    b.chaseT -= dt;
    moveTo(b, player.x, player.y, b.speed*1.12, dt);
    if (dist(b, player) < 52 && player.carrying) {
      dropCarried(player, true);
      b.state = 'idle'; b.think = rand(3,6);
      S.stats.lost++;
      toast('💥 ' + b.name + ' caught you! Pet returned.', 'bad');
      burst3D(player.x, 1.5, player.y, 20, '#f43f5e');
      playSound(160, 0.18, 'sawtooth', 0.07);
      return;
    }
    if (b.chaseT <= 0 || !player.carrying) { b.state = 'idle'; b.think = rand(3,7); }
    return;
  }

  if (b.state === 'return') {
    const home = bases[b.baseId];
    if (moveTo(b, home.x, home.y, b.speed*0.62, dt) || insideBase(home, b.x, b.y, -20)) {
      const pet = b.carrying;
      if (pet) {
        pet.carrier = null;
        pet.baseId = b.baseId;
        pet.homeBase = b.baseId;
        const inn = baseInner(home);
        pet.x = rand(inn.x0, inn.x1);
        pet.y = rand(inn.y0, inn.y1);
        burst3D(pet.x, 1.5, pet.y, 18, '#ffd75e');
      }
      b.carrying = null;
      b.state = 'idle'; b.think = rand(5,11);
      b.money += rand(50, 400);
      return;
    }
    if (b.carrying) { b.carrying.x = b.x; b.carrying.y = b.y; }
    return;
  }

  if (b.state === 'goto') {
    const pet = b.target;
    if (!pet || pet.carrier || pet.baseId === b.baseId || bases[pet.baseId].shieldUntil > NOW) {
      b.state = 'idle'; b.think = rand(2,5); b.target = null;
      return;
    }
    const d = dist(b, pet);
    if (d > 52) {
      moveTo(b, pet.x, pet.y, b.speed, dt);
    } else {
      b.grabT += dt;
      if (b.grabT >= 1.4) {
        pet.carrier = b; b.carrying = pet; b.grabT = 0;
        b.state = 'return';
        if (pet.baseId === 0) {
          toast('🚨 ' + b.name + ' is stealing your ' + petDef(pet).n + '!', 'bad');
          playSound(300, 0.15, 'square', 0.06);
        }
      }
    }
    return;
  }

  b.think -= dt;
  b.wanderT -= dt;
  if (b.wanderT <= 0) {
    const inn = baseInner(bases[b.baseId]);
    b.wanderX = rand(inn.x0, inn.x1);
    b.wanderY = rand(inn.y0, inn.y1);
    b.wanderT = rand(2,5);
  }
  moveTo(b, b.wanderX, b.wanderY, b.speed*0.42, dt);

  if (b.think <= 0) {
    b.think = rand(5,12);
    trySteal(b);
  }
}

function trySteal(b) {
  if (b.carrying) return;
  const cands = pets.filter(p => !p.carrier && p.baseId !== b.baseId && bases[p.baseId].shieldUntil <= NOW);
  if (!cands.length) return;
  let target = null;
  const playerPets = cands.filter(p => p.baseId === 0);
  if (playerPets.length && Math.random() < 0.45) target = pick(playerPets);
  else target = pick(cands);
  const owner = bases[target.baseId];
  if (owner.bot && owner.bot === b) return;
  b.target = target; b.state = 'goto'; b.grabT = 0;
  if (target.baseId === 0) toast('⚠️ ' + b.name + ' is heading toward your base!', 'bad');
}

function leaderboardData() {
  const rows = [{name:'You', money:S.money, stolen:S.stats.stolen, level:S.level,
    waves:S.waves, me:true, color:'#3b82f6'}];
  for (const b of bots) {
    rows.push({name:b.name, money:b.money, stolen:b.stolen, level:b.level,
      waves:Math.min(49, Math.floor(b.level*3.1)), me:false, color:b.color});
  }
  return rows;
}

function update(dt) {
  T += dt;
  NOW = performance.now()/1000;

  const inc = income();
  if (inc > 0) { S.money += inc*dt; S.totalEarned += inc*dt; }

  updatePlayer(dt);
  for (const b of bots) updateBot(b, dt);
  updatePetsLogic(dt);
  updateParticles(dt);
  updateFloaters(dt);

  for (const b of bots) {
    let bi = 0;
    for (const p of pets) if (p.baseId === b.baseId && !p.carrier) bi += petIncome(p);
    b.money += bi*dt*(0.8 + Math.random()*0.05);
    b.level = Math.max(b.level, Math.min(60, Math.floor(Math.sqrt(b.money)/40) + 1));
  }

  moneyFloaterTimer -= dt;
  if (moneyFloaterTimer <= 0 && inc > 0) {
    moneyFloaterTimer = 0.9;
    const myPetList = pets.filter(p => p.baseId === 0 && !p.carrier);

   RENDER
   ================================================================== */
const stealBar = document.getElementById('stealBar');
const stealBarFill = document.getElementById('stealBarFill');

function updateEntityVisual(e, dt) {
  if (!e.mesh) return;

  const dx = e.x - e._lx;
  const dy = e.y - e._ly;
  const moved = Math.hypot(dx, dy);
  e._lx = e.x; e._ly = e.y;

  if (moved > 0.3) {
    e.walkPhase = (e.walkPhase || 0) + dt * 11;
    e.facing = Math.atan2(dx, dy);
  } else {
    e.walkPhase = lerp(e.walkPhase || 0, 0, Math.min(1, dt * 8));
  }

  e.mesh.position.set(s(e.x), 0, s(e.y));

  if (e.facing !== undefined) {
    let diff = e.facing - e.mesh.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    e.mesh.rotation.y += diff * Math.min(1, dt * 14);
  }

  if (e.limbs) {
    const sw = Math.sin(e.walkPhase || 0) * 0.65;
    e.limbs.legL.rotation.x = sw;
    e.limbs.legR.rotation.x = -sw;
    e.limbs.armL.rotation.x = -sw * 0.75;
    e.limbs.armR.rotation.x = sw * 0.75;
    e.body.position.y = Math.abs(Math.sin((e.walkPhase || 0) * 2)) * 0.06;
  }

  if (e.carrying && e.carrying.mesh) {
    e.carrying.mesh.position.set(
      s(e.x),
      3.2 + Math.sin(T * 6) * 0.18,
      s(e.y)
    );
  }
}

function updatePetVisual(pet, dt) {
  if (!pet.mesh) return;
  if (pet.carrier) {
    pet.pedestal.visible = false;
    pet.ring.visible = false;
    pet.glow.visible = false;
    if (pet.beam) pet.beam.visible = false;
    pet.sprite.position.y = 0;
  } else {
    pet.pedestal.visible = true;
    pet.ring.visible = true;
    pet.glow.visible = true;
    if (pet.beam) pet.beam.visible = true;
    pet.mesh.position.set(s(pet.x), 0, s(pet.y));
    pet.sprite.position.y = 1.85 + Math.sin(pet.bob) * 0.15;
    pet.ring.scale.setScalar(1 + Math.sin(T*3 + pet.uid) * 0.08);
    pet.glow.material.opacity = 0.3 + Math.sin(T*3 + pet.uid) * 0.12;
  }
}

function render(dt) {
  // Roblox-style orbit camera
  const targetPos = new THREE.Vector3(s(player.x), 2, s(player.y));
  const offset = new THREE.Vector3(
    Math.sin(cameraYaw) * Math.cos(cameraPitch),
    Math.sin(cameraPitch),
    Math.cos(cameraYaw) * Math.cos(cameraPitch)
  ).multiplyScalar(camDistance);

  // Smooth camera follow
  const camTarget = targetPos.clone().add(offset);
  camPos.lerp(camTarget, Math.min(1, dt * 8));
  
  camera.position.copy(camPos);
  camera.lookAt(targetPos.x, targetPos.y + 1, targetPos.z);

  updateEntityVisual(player, dt);
  for (const b of bots) updateEntityVisual(b, dt);
  for (const p of pets) updatePetVisual(p, dt);

  for (const b of bases) {
    if (b.shieldMesh) {
      b.shieldMesh.visible = b.shieldUntil > NOW;
      if (b.shieldMesh.visible) {
        // Pulse shield opacity
        b.shieldMesh.material.opacity = 0.15 + Math.sin(T*4) * 0.1;
      }
    }
  }

  if (player.stealTarget && player.stealProgress > 0.02) {
    const t = player.stealTarget;
    _v.set(s(t.x), 3.0, s(t.y)).project(camera);
    if (_v.z < 1) {
      stealBar.style.display = 'block';
      const sx = (_v.x*0.5 + 0.5)*window.innerWidth;
      const sy = (-_v.y*0.5 + 0.5)*window.innerHeight;
      stealBar.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-50%)`;
      stealBarFill.style.width = (player.stealProgress*100) + '%';
    } else {
      stealBar.style.display = 'none';
    }
  } else {
    stealBar.style.display = 'none';
  }

  renderer.render(scene, camera);
}

function rollEgg(egg) {
  const total = Object.values(egg.w).reduce((a,b) => a+b, 0);
  let r = Math.random()*total, chosen = null;
  for (const k in egg.w) { r -= egg.w[k]; if (r <= 0) { chosen = k; break; } }
  if (!chosen) chosen = Object.keys(egg.w)[0];
  const pool = PETS.map((p,i) => ({p,i})).filter(o => o.p.r === chosen);
  return pick(pool).i;
}

function runWave() {
  const g = S.waves;
  if (power() < waveRequirement(g)) return;
  const isBoss = (g % WAVES_PER_WORLD) === WAVES_PER_WORLD - 1;

  panelTitle.textContent = isBoss ? '⚔️ BOSS WAVE' : '🏁 Wave Race';
  panelBody.innerHTML = `<div class="center" style="padding:6px 0 0">
    <div class="dim" style="margin-bottom:10px">${WORLDS[Math.min(9, Math.floor(g/5))].emoji} ${WORLDS[Math.min(9, Math.floor(g/5))].name} — Wave ${(g%5)+1}</div>
    <div class="race">
      <div class="raceTrack"><div class="raceFill" id="rMe"></div><span class="raceLabel">YOU</span></div>
      <div class="raceTrack"><div class="raceFill rival" id="rBot"></div><span class="raceLabel">RIVAL</span></div>
    </div>
    <div class="dim" id="raceMsg">Racing...</div>
  </div>`;

  const meEl = document.getElementById('rMe');
  const botEl = document.getElementById('rBot');
  const myDur = 1400 - S.sp.speed*140 - S.sp.strength*40;
  const botDur = myDur + rand(-140, 320);
  const t0 = performance.now();

  function step() {
    const el = performance.now() - t0;
    const a = clamp(el/myDur, 0, 1);
    const b = clamp(el/botDur, 0, 1);
    if (meEl) meEl.style.width = (a*100) + '%';
    if (botEl) botEl.style.width = (b*100) + '%';
    if (a >= 1 || b >= 1) { finishWave(g, isBoss, a >= b); return; }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

      ✅ <b style="color:#ffd75e">+120 Power</b> for challenges<br>
      ✅ One free <b style="color:#f43f5e">Mythic-or-better</b> pet<br>
      ✅ Keeps all your pets!<br><br>
      <b style="color:#fff">Resets:</b><br>
      ❌ Money goes back to 💰 200<br>
      ❌ All upgrades reset to Level 1
    </div>
    <div class="btnrow" style="max-width:300px;margin:22px auto 0">
      <button class="btn purple" id="doRebirth" ${can ? '' : 'disabled'}>
        ${can ? '♻️ REBIRTH NOW' : '🔒 Requirements not met'}
      </button>
    </div>
    <div class="dim" style="margin-top:14px">Current income multiplier: <b style="color:#7dffb0">×${incomeMult().toFixed(2)}</b></div>
  </div>`;
  const b = document.getElementById('doRebirth');
  if (b && can) b.onclick = () => {
    S.rebirths++;
    S.money = 200;
    S.level = 1; S.xp = 0;
    for (const k in S.sp) S.sp[k] = 1;
    const pool = PETS.map((p,i) => ({p,i})).filter(o => RAR_ORDER.indexOf(o.p.r) >= 5);
    const sp = pick(pool).i;
    addPet(sp, 0);
    S.collection[sp] = (S.collection[sp] || 0) + 1;
    const d = PETS[sp], r = RARITY[d.r];
    burst3D(player.x, 2, player.y, 50, '#c78bff');
    toast('♻️ REBIRTH ' + S.rebirths + '! You got a ' + r.name + ' ' + d.n + '!', 'epic');
    playSound(523, 0.15, 'sine', 0.07);
    setTimeout(() => playSound(784, 0.2, 'sine', 0.07), 150);
    setTimeout(() => playSound(1046, 0.3, 'sine', 0.07), 300);
    renderRebirth(); save();
  };
}

/* ==================================================================
   BOT PETS
   ================================================================== */
function spawnBotPets() {
  for (let i = 1; i < 8; i++) {
    const n = randi(3, 5);
    const pool = RAR_ORDER.slice(0, 3);
    for (let k = 0; k < n; k++) {
      const rar = pick(pool);
      const options = PETS.map((p,idx) => ({p,idx})).filter(o => o.p.r === rar);
      if (options.length) addPet(pick(options).idx, i);
    }
  }
}

/* ==================================================================
   NEW GAME
   ================================================================== */
function newGame() {
  S.money = 120; S.totalEarned = 0; S.xp = 0; S.level = 1;
  for (const k in S.sp) S.sp[k] = 1;
  S.collection = {}; S.waves = 0; S.rebirths = 0;
  S.stats = {stolen:0, lost:0, eggs:0, waves:0};
  bases[0].shieldUntil = 0;
  addPet(0, 0);
  S.collection[0] = 1;
  setTimeout(() => {
    toast('🐾 Welcome to STEAL THE PETS 3D!', 'gold');
    setTimeout(() => toast('Steal pets from other bases and bring them home!', ''), 2200);
    setTimeout(() => toast('Drag the screen to rotate the camera!', 'good'), 4600);
  }, 500);
}

/* ==================================================================
   BOOT
   ================================================================== */
function boot() {
  makeBases();
  addDecorations();
  initBots();
  createEntityMesh(player);

  const loaded = load();
  spawnBotPets();
  if (!loaded) newGame();

  camPos.set(player.x * SCALE, 15, player.y * SCALE);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setInterval(save, 8000);
  window.addEventListener('beforeunload', save);

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last)/1000);
    last = now;
    update(dt);
    render(dt);
    updateHUD(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__gameStarted = true;
}

boot();
</script>
